<figcaption><b>A window's position ids alone reconstruct its block-diagonal attention mask.</b> Three short documents are wrapped in bos/eos, concatenated, and sliced into fixed seq_len=8 windows; document C spills entirely across the hard window boundary until its own eos lands in Window 2. Because every document's position ids restart at 0, <code>doc_id = cumsum(position_id==0)</code> recovers exact document boundaries from position ids alone, so Window 1's mask is block-lower-triangular and token b2 can never attend to document A even though A sits earlier in the same physical window.</figcaption>
