<figure class="viz" id="fig-three-forces-2019-to-2026">
<button class="viz-replay" type="button">/replay</button>
<svg viewBox="0 0 780 470" role="img" aria-label="GPT-2 124M from 2019 and Stack-100M from 2026 have the same parameter count, but three algorithmic forces -- massive over-training, data quality over quantity, and architecture plus optimizer transfer -- turn the same size into a categorically better model.">
  <style>
    #fig-three-forces-2019-to-2026 .ttl{ font:700 15px var(--sans,sans-serif); }
    #fig-three-forces-2019-to-2026 .card-ttl{ font:700 13px var(--sans,sans-serif); }
    #fig-three-forces-2019-to-2026 .card-sub{ font:500 10.5px var(--sans,sans-serif); }
    #fig-three-forces-2019-to-2026 .row-lbl{ font:600 11px var(--sans,sans-serif); }
    #fig-three-forces-2019-to-2026 .row-val{ font:500 10.5px var(--mono,monospace); }
    #fig-three-forces-2019-to-2026 .force-lbl{ font:700 11.5px var(--sans,sans-serif); }
    #fig-three-forces-2019-to-2026 .force-sub{ font:500 10px var(--sans,sans-serif); }
    #fig-three-forces-2019-to-2026 .banner{ font:700 13px var(--sans,sans-serif); }
    #fig-three-forces-2019-to-2026 .foot{ font:500 9.5px var(--sans,sans-serif); }
    #fig-three-forces-2019-to-2026 text{ fill: var(--ink-soft); }
    #fig-three-forces-2019-to-2026 .dim{ fill: var(--muted); }
  </style>

  <text x="390" y="22" text-anchor="middle" class="ttl">Same 100M parameters, categorically better model</text>

  <!-- banner -->
  <g data-anim="1">
    <rect x="30" y="34" width="720" height="28" rx="6" class="v-fill" stroke="var(--border-2)" stroke-width="1.2"/>
    <text x="390" y="53" text-anchor="middle" class="banner">Same parameter count (~100M) -&gt; categorically better model</text>
  </g>

  <!-- LEFT CARD: GPT-2 -->
  <g data-anim="2">
    <rect x="20" y="76" width="230" height="300" rx="8" class="v-fill" stroke="var(--v-stroke)" stroke-width="1.3"/>
    <text x="135" y="98" text-anchor="middle" class="card-ttl">GPT-2 124M (2019)</text>
    <line x1="35" y1="108" x2="235" y2="108" class="v-grid" stroke-width="1"/>

    <text x="35" y="128" class="row-lbl">Tokens</text>
    <text x="235" y="128" text-anchor="end" class="row-val">~10B (~80/param)</text>

    <text x="35" y="152" class="row-lbl">Data curation</text>
    <text x="235" y="166" text-anchor="end" class="row-val dim">lightly filtered WebText</text>
    <text x="235" y="180" text-anchor="end" class="row-val dim">(Reddit-karma links)</text>

    <text x="35" y="204" class="row-lbl">Positions</text>
    <text x="235" y="204" text-anchor="end" class="row-val">learned absolute</text>

    <text x="35" y="228" class="row-lbl">Norm</text>
    <text x="235" y="228" text-anchor="end" class="row-val">LayerNorm</text>

    <text x="35" y="252" class="row-lbl">MLP</text>
    <text x="235" y="252" text-anchor="end" class="row-val">GELU MLP</text>

    <text x="35" y="276" class="row-lbl">Attention</text>
    <text x="235" y="276" text-anchor="end" class="row-val">full multi-head</text>

    <text x="35" y="300" class="row-lbl">Optimizer</text>
    <text x="235" y="300" text-anchor="end" class="row-val">Adam + cosine</text>

    <rect x="35" y="330" width="200" height="30" rx="5" fill="var(--muted)" fill-opacity="0.12" stroke="var(--border-2)" stroke-width="1"/>
    <text x="135" y="349" text-anchor="middle" class="row-val">~124M params</text>
  </g>

  <!-- RIGHT CARD: Stack-100M -->
  <g data-anim="2">
    <rect x="530" y="76" width="230" height="300" rx="8" class="v-fill" stroke="var(--accent)" stroke-width="1.4"/>
    <text x="645" y="98" text-anchor="middle" class="card-ttl">Stack-100M (2026)</text>
    <line x1="545" y1="108" x2="745" y2="108" class="v-grid" stroke-width="1"/>

    <text x="545" y="128" class="row-lbl">Tokens</text>
    <text x="745" y="128" text-anchor="end" class="row-val">~20B (~200/param)</text>

    <text x="545" y="152" class="row-lbl">Data curation</text>
    <text x="745" y="166" text-anchor="end" class="row-val" fill="var(--accent)">FineWeb-Edu filtered +</text>
    <text x="745" y="180" text-anchor="end" class="row-val" fill="var(--accent)">Cosmopedia synthetic</text>

    <text x="545" y="204" class="row-lbl">Positions</text>
    <text x="745" y="204" text-anchor="end" class="row-val" fill="var(--accent)">RoPE + NoPE</text>

    <text x="545" y="228" class="row-lbl">Norm</text>
    <text x="745" y="228" text-anchor="end" class="row-val" fill="var(--accent)">RMSNorm</text>

    <text x="545" y="252" class="row-lbl">MLP</text>
    <text x="745" y="252" text-anchor="end" class="row-val" fill="var(--accent)">SwiGLU</text>

    <text x="545" y="276" class="row-lbl">Attention</text>
    <text x="745" y="276" text-anchor="end" class="row-val" fill="var(--accent)">GQA + QK-norm</text>

    <text x="545" y="300" class="row-lbl">Optimizer</text>
    <text x="745" y="300" text-anchor="end" class="row-val" fill="var(--accent)">Muon+AdamW + WSD</text>

    <rect x="545" y="330" width="200" height="30" rx="5" fill="var(--accent)" fill-opacity="0.14" stroke="var(--accent)" stroke-width="1"/>
    <text x="645" y="349" text-anchor="middle" class="row-val" fill="var(--accent)">~101M params</text>
  </g>

  <!-- MIDDLE: three stacked force arrows -->
  <g data-anim="3">
    <!-- arrow 1 -->
    <g>
      <path d="M258 130 H500" stroke="var(--accent)" stroke-width="10" fill="none" marker-end="url(#tf-arrow)"/>
      <text x="379" y="122" text-anchor="middle" class="force-lbl" fill="var(--surface,#fff)">1</text>
    </g>
    <rect x="270" y="140" width="240" height="28" rx="5" class="v-fill" stroke="var(--accent)" stroke-width="1"/>
    <text x="390" y="153" text-anchor="middle" class="force-sub">Massive over-training</text>
    <text x="390" y="165" text-anchor="middle" class="force-sub dim">~10x past Chinchilla-optimal</text>

    <!-- arrow 2 -->
    <path d="M258 213 H500" stroke="var(--accent)" stroke-width="10" fill="none" marker-end="url(#tf-arrow)"/>
    <text x="379" y="205" text-anchor="middle" class="force-lbl" fill="var(--surface,#fff)">2</text>
    <rect x="270" y="223" width="240" height="28" rx="5" class="v-fill" stroke="var(--accent)" stroke-width="1"/>
    <text x="390" y="236" text-anchor="middle" class="force-sub">Data quality over quantity</text>
    <text x="390" y="248" text-anchor="middle" class="force-sub dim">curated + synthetic</text>

    <!-- arrow 3 -->
    <path d="M258 296 H500" stroke="var(--accent)" stroke-width="10" fill="none" marker-end="url(#tf-arrow)"/>
    <text x="379" y="288" text-anchor="middle" class="force-lbl" fill="var(--surface,#fff)">3</text>
    <rect x="270" y="306" width="240" height="28" rx="5" class="v-fill" stroke="var(--accent)" stroke-width="1"/>
    <text x="390" y="319" text-anchor="middle" class="force-sub">Architecture + optimizer transfer</text>
    <text x="390" y="331" text-anchor="middle" class="force-sub dim">borrowed from frontier labs</text>
  </g>

  <defs>
    <marker id="tf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- footnote -->
  <g data-anim="4">
    <rect x="30" y="392" width="720" height="46" rx="6" class="v-fill" stroke="var(--border-2)" stroke-width="1"/>
    <text x="390" y="411" text-anchor="middle" class="foot">These are algorithmic choices, not hardware -- the same recipe on 2019 GPUs still wins.</text>
    <text x="390" y="427" text-anchor="middle" class="foot dim">Hardware improved throughput; the loss-per-parameter gap comes from the three forces above.</text>
  </g>

  <text x="390" y="458" text-anchor="middle" class="foot dim">GPT-2 vs. Stack-100M: same size, three algorithmic forces apart</text>
</svg>
<figcaption><b>Stack-100M reaches GPT-2's parameter count but not its era.</b> Three algorithmic forces — training far past Chinchilla-optimal, curating data instead of just scraping it, and transferring architecture and optimizer tricks from frontier labs — turn the same ~100M parameters into a categorically stronger model, without any hardware advantage doing the work.</figcaption>
</figure>
