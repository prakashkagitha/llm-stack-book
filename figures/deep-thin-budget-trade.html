<figure class="viz" id="fig-deep-thin-budget-trade">
<button class="viz-replay" type="button">/replay</button>
<svg viewBox="0 0 780 470" role="img" aria-label="Two models spending the same fixed parameter budget: shallow-and-wide GPT-2-small shape with 12 fat layers versus deep-and-thin Stack-100M with 30 thin layers, showing that d squared times L is pinned and depth wins at small scale.">
<style>
  #fig-deep-thin-budget-trade text     { fill: var(--ink-soft,#45413a); }
  #fig-deep-thin-budget-trade .ttl     { font: 700 15.5px var(--sans,sans-serif); fill: currentColor; }
  #fig-deep-thin-budget-trade .sub     { font: 500 11px var(--sans,sans-serif); fill: var(--muted,#6d675d); }
  #fig-deep-thin-budget-trade .hdr     { font: 700 12.5px var(--sans,sans-serif); }
  #fig-deep-thin-budget-trade .lbl     { font: 600 10.5px var(--sans,sans-serif); }
  #fig-deep-thin-budget-trade .small   { font: 500 9.5px var(--sans,sans-serif); fill: var(--muted,#6d675d); }
  #fig-deep-thin-budget-trade .mono    { font: 600 10.5px var(--mono,monospace); }
  #fig-deep-thin-budget-trade .eq      { font: 600 11.5px var(--mono,monospace); }
  #fig-deep-thin-budget-trade .tag     { font: 700 9.5px var(--sans,sans-serif); }
</style>

<text x="20" y="24" class="ttl">Same fixed budget, two ways to spend it</text>
<text x="20" y="41" class="sub">Per-layer params ~ 12.25 d^2, so body ~ 12.25 d^2 L -- the product d^2 L is pinned by the budget, not d or L alone.</text>

<g data-anim="1">
  <rect x="20" y="54" width="740" height="20" rx="5" fill="var(--surface-3,#ece7da)" stroke="var(--border-2,#d8d1c0)" stroke-width="1.2"/>
  <text x="390" y="68" text-anchor="middle" class="lbl">fixed budget: body ~= 84.5M params (d^2 L pinned)</text>
</g>

<g data-anim="2">
  <text x="20" y="98" class="hdr">shallow-and-wide (GPT-2-small shape)</text>
  <text x="20" y="112" class="small">d_model=768, n_layers=12, width/layer d/L ~= 64</text>


  <g>
    <rect x="70" y="128" width="230" height="20" rx="3" class="v-fill" stroke="var(--v-muted,#6d675d)" stroke-width="1.3"/>
    <rect x="70" y="152" width="230" height="20" rx="3" class="v-fill" stroke="var(--v-muted,#6d675d)" stroke-width="1.3"/>
    <rect x="70" y="176" width="230" height="20" rx="3" class="v-fill" stroke="var(--v-muted,#6d675d)" stroke-width="1.3"/>
    <rect x="70" y="200" width="230" height="20" rx="3" class="v-fill" stroke="var(--v-muted,#6d675d)" stroke-width="1.3"/>
    <rect x="70" y="224" width="230" height="20" rx="3" class="v-fill" stroke="var(--v-muted,#6d675d)" stroke-width="1.3"/>
    <text x="185" y="142" text-anchor="middle" class="small">12 fat blocks (5 shown)</text>
  </g>
  <text x="185" y="260" text-anchor="middle" class="small">... 12 layers total, each very wide</text>


  <line x1="315" y1="138" x2="360" y2="138" stroke="var(--v-muted,#6d675d)" stroke-width="2" marker-end="url(#arrLeft)"/>
  <text x="378" y="142" class="small">lots stored per token,</text>
  <text x="378" y="154" class="small">few compositional steps</text>
</g>

<g data-anim="3">
  <text x="470" y="98" class="hdr">deep-and-thin (Stack-100M)</text>
  <text x="470" y="112" class="small">d_model=512, n_layers=30, width/layer d/L ~= 17</text>

  <g>
    <rect x="530" y="126" width="70" height="9" rx="2" fill="var(--accent,#c15b39)"/>
    <rect x="530" y="138" width="70" height="9" rx="2" fill="var(--accent,#c15b39)"/>
    <rect x="530" y="150" width="70" height="9" rx="2" fill="var(--accent,#c15b39)"/>
    <rect x="530" y="162" width="70" height="9" rx="2" fill="var(--accent,#c15b39)"/>
    <rect x="530" y="174" width="70" height="9" rx="2" fill="var(--accent,#c15b39)"/>
    <rect x="530" y="186" width="70" height="9" rx="2" fill="var(--accent,#c15b39)"/>
    <rect x="530" y="198" width="70" height="9" rx="2" fill="var(--accent,#c15b39)"/>
    <rect x="530" y="210" width="70" height="9" rx="2" fill="var(--accent,#c15b39)"/>
    <rect x="530" y="222" width="70" height="9" rx="2" fill="var(--accent,#c15b39)"/>
    <rect x="530" y="234" width="70" height="9" rx="2" fill="var(--accent,#c15b39)"/>
    <text x="565" y="120" text-anchor="middle" class="small">30 thin blocks (10 shown)</text>
  </g>
  <text x="565" y="260" text-anchor="middle" class="small">... 30 layers total, each narrow</text>

  <rect x="620" y="120" width="120" height="30" rx="5" fill="var(--surface-3,#ece7da)" stroke="var(--accent,#c15b39)" stroke-width="1.2"/>
  <text x="680" y="139" text-anchor="middle" class="tag" fill="var(--accent,#c15b39)">~4x thinner</text>
  <text x="680" y="150" text-anchor="middle" class="tag" fill="var(--accent,#c15b39)">per layer</text>

  <line x1="565" y1="246" x2="565" y2="290" stroke="var(--accent,#c15b39)" stroke-width="2.4" marker-end="url(#arrDown)"/>
  <text x="565" y="304" text-anchor="middle" class="small" fill="var(--accent,#c15b39)">sequential nonlinear transforms</text>
  <text x="565" y="316" text-anchor="middle" class="small" fill="var(--accent,#c15b39)">= reasoning depth</text>
  <text x="565" y="328" text-anchor="middle" class="small" fill="var(--accent,#c15b39)">(what small models are bottlenecked on)</text>
</g>

<g data-anim="4">
  <line x1="20" y1="356" x2="760" y2="356" stroke="var(--border-2,#d8d1c0)" stroke-width="1"/>
  <text x="390" y="376" text-anchor="middle" class="eq">per-layer ~= 12.25 d^2   =&gt;   body ~= 12.25 d^2 L   =&gt;   double d costs 3/4 of your layers</text>
</g>

<g data-anim="5">
  <rect x="20" y="398" width="740" height="52" rx="7" fill="var(--surface-3,#ece7da)" fill-opacity="0.5" stroke="var(--border-2,#d8d1c0)" stroke-width="1.1"/>
  <text x="390" y="420" text-anchor="middle" class="lbl">at ~100M the evidence flips to depth (MobileLLM, 2024)</text>
  <text x="390" y="438" text-anchor="middle" class="lbl">at ~100B, width and depth trade evenly</text>
</g>

<defs>
  <marker id="arrLeft" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="var(--v-muted,#6d675d)"/>
  </marker>
  <marker id="arrDown" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
    <path d="M0,0 L8,0 L4,8 Z" fill="var(--accent,#c15b39)"/>
  </marker>
</defs>

</svg>
<figcaption><b>The same fixed budget can buy a few wide layers or many narrow ones, because it is the product d^2 x L that is pinned, not d or L separately.</b> Doubling width costs three-quarters of your layers; at the ~100M scale of Stack-100M the sub-billion evidence (MobileLLM, 2024) favors spending the budget on depth -- more sequential nonlinear transforms per token -- over storing more per layer.</figcaption>
</figure>
