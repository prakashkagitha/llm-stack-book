<figure class="viz" id="fig-honest-eval-four-probes-asymmetry">
<button class="viz-replay" type="button">replay</button>
<svg viewBox="0 0 720 470" role="img" aria-label="The four capability probes lean on different skills: held-out perplexity is a broad meter rather than a skill test, arithmetic and retrieval-QA are narrow and scaffolded and score well, and the tiny multiple-choice set needs broad world knowledge the model never had capacity to store and sits near chance. That asymmetry is itself the finding.">
  <style>
    #fig-honest-eval-four-probes-asymmetry text{ fill:var(--ink-soft); }
    #fig-honest-eval-four-probes-asymmetry .hdr{ font:700 13px var(--sans,sans-serif); }
    #fig-honest-eval-four-probes-asymmetry .lbl{ font:700 11.5px var(--sans,sans-serif); }
    #fig-honest-eval-four-probes-asymmetry .mono{ font:600 10.5px var(--mono,monospace); }
    #fig-honest-eval-four-probes-asymmetry .small{ font:500 10px var(--sans,sans-serif); fill:var(--muted); }
    #fig-honest-eval-four-probes-asymmetry .cap{ font:500 10.5px var(--sans,sans-serif); fill:var(--muted); }
    #fig-honest-eval-four-probes-asymmetry .axislbl{ font:700 10.5px var(--sans,sans-serif); fill:var(--muted); }
  </style>

  <g data-anim="1">
    <text x="360" y="22" text-anchor="middle" class="hdr" fill="var(--accent)">Four probes, four different skills</text>
  </g>

  <!-- vertical axis rail on the left: broad/parametric (top) to narrow/scaffolded (bottom) -->
  <g data-anim="2">
    <line x1="54" y1="52" x2="54" y2="375" class="v-stroke" stroke="currentColor" stroke-width="1.4"/>
    <line x1="48" y1="52" x2="60" y2="52" class="v-stroke" stroke="currentColor" stroke-width="1.2"/>
    <line x1="48" y1="375" x2="60" y2="375" class="v-stroke" stroke="currentColor" stroke-width="1.2"/>
    <text x="16" y="42" class="axislbl">broad / parametric knowledge</text>
    <text x="16" y="391" class="axislbl">narrow / scaffolded, grading unambiguous</text>
  </g>

  <!-- Card 1: held-out perplexity, set apart as "the meter" -->
  <g data-anim="3">
    <rect x="480" y="54" width="220" height="94" rx="7" class="v-fill v-stroke" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="494" y="74" class="lbl" fill="var(--accent)">HELD-OUT PERPLEXITY</text>
    <text x="494" y="90" class="small">predictive fit to held-out web text;</text>
    <text x="494" y="103" class="small">cheap to make honest (provably</text>
    <text x="494" y="116" class="small">excluded shard) -- the one trustworthy</text>
    <text x="494" y="129" class="small">number, but averages over everything.</text>
    <text x="330" y="80" text-anchor="middle" class="cap" font-style="italic">the meter, not a skill test</text>
    <path d="M330 86 L470 100" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/>
  </g>

  <!-- Card 2: Arithmetic, narrow/scaffolded, scores well -->
  <g data-anim="4">
    <rect x="70" y="180" width="300" height="82" rx="7" class="v-fill v-stroke" stroke-width="1.2"/>
    <text x="84" y="200" class="lbl" fill="var(--good,#2f9e6e)">ARITHMETIC, exact-match</text>
    <text x="84" y="217" class="small">reliable reasoning; directly checks</text>
    <text x="84" y="230" class="small">whether narrow RLVR stuck.</text>
    <text x="84" y="248" class="small" fill="var(--good,#2f9e6e)">scores well above chance</text>
  </g>

  <!-- Card 3: Tiny MC, cloze-scored, near chance -->
  <g data-anim="5">
    <rect x="380" y="180" width="316" height="150" rx="7" class="v-fill v-stroke" stroke-width="1.2"/>
    <text x="394" y="200" class="lbl" fill="var(--warn,#e0a106)">TINY MC, cloze-scored</text>

    <!-- cloze mechanic inset -->
    <rect x="394" y="210" width="288" height="60" rx="5" fill="none" class="v-stroke" stroke-width="0.9" stroke-dasharray="2 2"/>
    <text x="402" y="224" class="mono" font-size="9">Q: "The capital of France is" + choice</text>
    <text x="402" y="237" class="mono" font-size="9">score = sum log p(token) per option</text>
    <text x="402" y="250" class="mono" font-size="9">pick argmax option (not: emit letter "A" --</text>
    <text x="402" y="262" class="mono" font-size="9">instruction-following too weak at 100M)</text>

    <text x="394" y="286" class="small">needs broad world knowledge the model</text>
    <text x="394" y="299" class="small">never had capacity to store --</text>
    <text x="394" y="316" class="small" fill="var(--warn,#e0a106)">sits near a coin flip</text>
  </g>

  <!-- Card 4: Retrieval-QA, narrow, scores well -->
  <g data-anim="6">
    <rect x="70" y="290" width="300" height="82" rx="7" class="v-fill v-stroke" stroke-width="1.2"/>
    <text x="84" y="310" class="lbl" fill="var(--good,#2f9e6e)">RETRIEVAL-QA, exact-match</text>
    <text x="84" y="327" class="small">reading comprehension when the answer</text>
    <text x="84" y="340" class="small">is handed to it in context; isolates</text>
    <text x="84" y="353" class="small">comprehension from parametric memory.</text>
    <text x="84" y="368" class="small" fill="var(--good,#2f9e6e)">scores well</text>
  </g>

  <!-- connector lines from axis to each card, at heights reflecting the qualitative position:
       card 3 (MC) connects near the top (broad end), cards 2 and 4 (arithmetic, retrieval-QA)
       connect lower (narrow end) -->
  <g data-anim="7">
    <path d="M54 168 L380 168" fill="none" class="v-grid" stroke="var(--warn,#e0a106)" stroke-width="1.3" opacity="0.75"/>
    <path d="M54 225 L70 225" fill="none" class="v-grid" stroke="var(--good,#2f9e6e)" stroke-width="1.3"/>
    <path d="M54 335 L70 335" fill="none" class="v-grid" stroke="var(--good,#2f9e6e)" stroke-width="1.3"/>
  </g>

  <!-- annotation near card 3 -->
  <g data-anim="8">
    <text x="538" y="350" text-anchor="middle" class="cap" fill="var(--warn,#e0a106)">the asymmetry IS the finding</text>
  </g>

  <!-- footer band -->
  <g data-anim="9">
    <rect x="16" y="400" width="688" height="56" rx="7" class="v-fill v-stroke" stroke-width="1.3"/>
    <text x="360" y="424" text-anchor="middle" class="lbl">the deliverable is the number PLUS an explicit statement</text>
    <text x="360" y="442" text-anchor="middle" class="lbl">of what it cannot do.</text>
  </g>
</svg>
<figcaption><b>The four probes lean on very different capacities, and the resulting pattern is itself the honest finding.</b> Perplexity is a broad meter, not a skill test; arithmetic and retrieval-QA are narrow, scaffolded, unambiguous to grade, and score well above chance; the closed-book multiple-choice set demands broad parametric world knowledge a 100M-parameter model never had room to store, and lands close to a coin flip. Report the number and the asymmetry together.</figcaption>
</figure>
