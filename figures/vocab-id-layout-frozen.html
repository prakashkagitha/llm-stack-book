<figcaption><b>The permanent id layout: raw bytes, learned merges, then nine reserved specials in a fixed order that is never renegotiated.</b> Ids 0-255 are the raw UTF-8 bytes (id equals the byte value), 256-32758 are the 32,503 BPE merges learned from the Stack-100M mix, and the top nine ids -- zoomed in above, in the exact order the chapter's table fixes -- are reserved special tokens such as id 32763 for <code>&lt;|user|&gt;</code>. Inserting a token later instead of reserving it up front shifts every id after the insertion point, which silently invalidates every checkpoint's embedding table.</figcaption>
</figure>
