<figure class="viz" id="fig-posttraining-ladder-100m">
<button class="viz-replay" type="button">&#x21BB; replay</button>
<svg viewBox="0 0 800 680" role="img" aria-label="A three-rung ascending ladder: SFT teaches format and instinct, DPO teaches taste and deletes the reward model and rollouts, narrow GRPO teaches a verifiable skill and deletes the critic. A faded full PPO-RLHF tower on the right shows what each rung avoids building. A banner at the bottom explains the ladder is load-bearing.">
<defs>
  <marker id="pl-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,1 L9,5 L0,9 Z" fill="var(--accent,#c15b39)"/>
  </marker>
</defs>
<style>
  #fig-posttraining-ladder-100m text { fill: currentColor; }
  #fig-posttraining-ladder-100m .ttl  { font: 700 12.5px var(--sans,sans-serif); fill: var(--ink); }
  #fig-posttraining-ladder-100m .sub  { font: 400 10px var(--sans,sans-serif); fill: var(--ink-soft,#45413a); }
  #fig-posttraining-ladder-100m .chip { font: 600 8.6px var(--mono,monospace); fill: var(--ink-soft,#45413a); }
  #fig-posttraining-ladder-100m .out  { font: 700 9.6px var(--sans,sans-serif); }
  #fig-posttraining-ladder-100m .strike { font: 600 8.8px var(--sans,sans-serif); fill: var(--warn,#e0a106); }
  #fig-posttraining-ladder-100m .qtag { font: 700 10px var(--sans,sans-serif); fill: var(--accent,#c15b39); }
  #fig-posttraining-ladder-100m .tow  { font: 600 9.4px var(--sans,sans-serif); fill: var(--muted,#6d675d); }
  #fig-posttraining-ladder-100m .towhd { font: 700 10.2px var(--sans,sans-serif); fill: var(--muted,#6d675d); }
  #fig-posttraining-ladder-100m .band { font: 400 10px var(--sans,sans-serif); fill: var(--ink-soft,#45413a); }
  #fig-posttraining-ladder-100m .bandb { font: 700 10px var(--sans,sans-serif); fill: var(--ink); }

  @keyframes pl-fi { from{opacity:0} to{opacity:1} }
  #fig-posttraining-ladder-100m [data-anim="1"] { animation: pl-fi .4s ease .1s both; }
  #fig-posttraining-ladder-100m [data-anim="2"] { animation: pl-fi .4s ease .7s both; }
  #fig-posttraining-ladder-100m [data-anim="3"] { animation: pl-fi .4s ease 1.4s both; }
  #fig-posttraining-ladder-100m [data-anim="4"] { animation: pl-fi .4s ease 2.1s both; }
  #fig-posttraining-ladder-100m [data-anim="5"] { animation: pl-fi .5s ease 2.7s both; }
  @media (prefers-reduced-motion: reduce) {
    #fig-posttraining-ladder-100m * { animation: none !important; opacity: 1 !important; }
  }
</style>

<!-- RUNG 3: GRPO/RLVR (top of ladder) -->
<g data-anim="4">
  <rect x="20" y="20" width="320" height="98" rx="8" fill="var(--accent,#c15b39)" fill-opacity=".16" stroke="var(--accent,#c15b39)" stroke-width="2.4"/>
  <text x="34" y="40" class="ttl" fill="var(--accent,#c15b39)">Rung 3 -- narrow GRPO/RLVR:</text>
  <text x="34" y="55" class="ttl" fill="var(--accent,#c15b39)">teaches a VERIFIABLE SKILL</text>
  <text x="34" y="72" class="sub">be correct on NEW inputs, graded</text>
  <text x="34" y="85" class="sub">by a program</text>
  <text x="34" y="104" class="out" fill="var(--accent,#c15b39)">output: narrow-skill model -&gt; agent (14.10)</text>
</g>
<g data-anim="4">
  <rect x="350" y="24" width="200" height="15" rx="4" fill="var(--surface,#fff)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="356" y="35" class="chip">group-relative clipped</text>
  <rect x="350" y="42" width="200" height="15" rx="4" fill="var(--surface,#fff)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="356" y="53" class="chip">surrogate + KL leash</text>
  <rect x="350" y="60" width="110" height="15" rx="4" fill="var(--surface,#fff)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="356" y="71" class="chip">~2-6 A100-hr</text>
  <text x="350" y="92" class="strike">deletes: the critic</text>
</g>

<!-- arrow: rung2 -> rung3 -->
<line data-anim="4" x1="150" y1="160" x2="150" y2="122" stroke="var(--accent,#c15b39)" stroke-width="2.2" marker-end="url(#pl-arr)"/>

<!-- RUNG 2: DPO -->
<g data-anim="3">
  <rect x="20" y="160" width="320" height="98" rx="8" fill="var(--accent,#c15b39)" fill-opacity=".10" stroke="var(--accent,#c15b39)" stroke-width="2"/>
  <text x="34" y="180" class="ttl" fill="var(--accent,#c15b39)">Rung 2 -- DPO: teaches TASTE</text>
  <text x="34" y="195" class="sub">prefer chosen over rejected</text>
  <rect x="34" y="203" width="264" height="26" rx="4" fill="var(--surface,#fff)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="40" y="214" class="chip">Bradley-Terry logistic on implicit</text>
  <text x="40" y="225" class="chip">reward, frozen SFT reference</text>
  <rect x="34" y="233" width="94" height="15" rx="4" fill="var(--surface,#fff)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="40" y="244" class="chip">~0.5-2 A100-hr</text>
  <text x="136" y="244" class="out" fill="var(--accent,#c15b39)">output: aligned chat model</text>
</g>
<g data-anim="3">
  <text x="350" y="186" class="strike">deletes: reward</text>
  <text x="350" y="198" class="strike">model + rollouts</text>
</g>

<!-- collective annotation for the three rungs -->
<g data-anim="5">
  <text x="450" y="228" class="qtag" text-anchor="middle">each answers a</text>
  <text x="450" y="243" class="qtag" text-anchor="middle">different question:</text>
  <text x="450" y="263" class="qtag" text-anchor="middle">FORMAT / TASTE / SKILL</text>
</g>

<!-- arrow: rung1 -> rung2 -->
<line data-anim="3" x1="150" y1="300" x2="150" y2="262" stroke="var(--accent,#c15b39)" stroke-width="2.2" marker-end="url(#pl-arr)"/>

<!-- RUNG 1: SFT -->
<g data-anim="2">
  <rect x="20" y="300" width="320" height="98" rx="8" fill="var(--accent,#c15b39)" fill-opacity=".10" stroke="var(--accent,#c15b39)" stroke-width="2"/>
  <text x="34" y="320" class="ttl" fill="var(--accent,#c15b39)">Rung 1 -- SFT: teaches FORMAT &amp; INSTINCT</text>
  <text x="34" y="336" class="sub">see a user turn -&gt; produce an assistant</text>
  <text x="34" y="349" class="sub">turn -&gt; STOP</text>
  <rect x="34" y="357" width="196" height="15" rx="4" fill="var(--surface,#fff)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="40" y="368" class="chip">assistant-masked cross-entropy</text>
  <rect x="238" y="357" width="96" height="15" rx="4" fill="var(--surface,#fff)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="244" y="368" class="chip">~0.5-2 A100-hr</text>
  <text x="34" y="386" class="out" fill="var(--accent,#c15b39)">output: chat model</text>
</g>

<!-- arrow: base -> rung1 -->
<line data-anim="1" x1="150" y1="440" x2="150" y2="402" stroke="var(--accent,#c15b39)" stroke-width="2.2" marker-end="url(#pl-arr)"/>

<!-- BASE node (start, bottom of the ladder) -->
<g data-anim="1">
  <rect x="20" y="440" width="270" height="66" rx="7" fill="var(--surface,#fff)" fill-opacity=".9" stroke="var(--v-stroke,#45413a)" stroke-width="1.5"/>
  <text x="32" y="458" class="ttl">Base model (Ch. 14.8)</text>
  <text x="32" y="472" class="sub">fluent text CONTINUER -- has knowledge</text>
  <text x="32" y="484" class="sub">and fluency, but no turns, instructions,</text>
  <text x="32" y="496" class="sub">or stop.</text>
</g>

<!-- RIGHT: faded full PPO-RLHF tower, deliberately avoided -->
<g data-anim="5" opacity="0.62">
  <text x="680" y="38" class="towhd" text-anchor="middle">full PPO-RLHF</text>
  <text x="680" y="52" class="towhd" text-anchor="middle">(deliberately avoided)</text>

  <rect x="580" y="66" width="200" height="34" rx="5" fill="none" stroke="var(--muted,#6d675d)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="680" y="87" class="tow" text-anchor="middle">reward model</text>
  <line x1="583" y1="69" x2="777" y2="97" stroke="var(--warn,#e0a106)" stroke-width="2.2"/>

  <rect x="580" y="106" width="200" height="34" rx="5" fill="none" stroke="var(--muted,#6d675d)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="680" y="122" class="tow" text-anchor="middle">policy</text>
  <text x="680" y="134" class="tow" text-anchor="middle">rollouts</text>
  <line x1="583" y1="109" x2="777" y2="137" stroke="var(--warn,#e0a106)" stroke-width="2.2"/>

  <rect x="580" y="146" width="200" height="34" rx="5" fill="none" stroke="var(--muted,#6d675d)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="680" y="167" class="tow" text-anchor="middle">value / critic net</text>
  <line x1="583" y1="149" x2="777" y2="177" stroke="var(--accent,#c15b39)" stroke-width="2.2"/>

  <rect x="580" y="186" width="200" height="34" rx="5" fill="none" stroke="var(--muted,#6d675d)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="680" y="207" class="tow" text-anchor="middle">frozen reference</text>

  <text x="680" y="236" class="sub" text-anchor="middle" fill="var(--muted,#6d675d)">what remains is exactly</text>
  <text x="680" y="249" class="sub" text-anchor="middle" fill="var(--muted,#6d675d)">what our budget affords.</text>
</g>

<!-- bottom banner -->
<g data-anim="5">
  <rect x="20" y="524" width="760" height="136" rx="8" fill="var(--surface-3,#ece7da)" fill-opacity=".55" stroke="var(--border-2,#d8d1c0)" stroke-width="1"/>
  <text x="36" y="546" class="bandb">Each rung cheaper than the last (a rounding error vs. the pretraining bill) --</text>
  <text x="36" y="562" class="bandb">and each is LOAD-BEARING:</text>
  <text x="36" y="583" class="band">Skip SFT and DPO has nothing coherent to prefer; skip both and GRPO's reward</text>
  <text x="36" y="598" class="band">is 0 everywhere and RL never starts.</text>
  <text x="36" y="622" class="bandb">Post-training changes what the model DOES, not what it KNOWS.</text>
</g>

</svg>
<figcaption><b>The post-training ladder at Stack-100M: SFT, then DPO, then narrow GRPO, each cheaper and more surgical than the last.</b> SFT teaches format, DPO teaches taste by deleting the reward model and rollouts, and narrow GRPO teaches one verifiable skill by deleting the critic too -- leaving, next to a faded full PPO-RLHF tower, exactly the machinery the budget affords. Every rung depends on the one below it: skip SFT and DPO has nothing coherent to prefer; skip both and GRPO's reward is zero everywhere.</figcaption>
</figure>
