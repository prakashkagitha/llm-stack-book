</svg>
<figcaption><b>One ReAct trajectory rendered as a single wire, top to bottom, exactly as it is fed to the trainer.</b> The right-hand rail marks which spans carry a gradient: assistant thoughts, tool-call JSON, the final answer, and the &lt;|end|&gt; that closes an assistant turn are all supervised, while the system prompt, the user question, and every &lt;|tool_result|&gt; span (including its closing &lt;|end|&gt;) are masked to <code>-100</code>. The same <code>&lt;|end|&gt;</code> token string therefore has two opposite fates depending on what it closes -- the crux of getting loss masking right for tool-using agents.</figcaption>
</figure>
