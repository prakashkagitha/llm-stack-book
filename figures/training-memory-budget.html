<figure class="viz" id="fig-training-memory-budget">
<svg viewBox="0 0 780 450" role="img" aria-label="Stacked bar comparison of training memory for one micro-batch, checkpointing off versus on, against two GPU memory ceilings. Both bars share thin fixed segments for fp32 master weights, gradients, and optimizer state, on the order of 1.7 GB total. The checkpointing-off bar adds a tall activations stack broken into residual stream across 30 blocks, SwiGLU intermediate across 30 blocks, and attention plus MLP plus the once-only logits and z-loss upcast buffer, together on the order of 25 GB, crossing the RTX 4090's 24 GB ceiling while staying well under the A100's 80 GB ceiling. The checkpointing-on bar collapses that activation stack to roughly one block's worth, on the order of 5 GB total, comfortably fitting under 24 GB, at a labeled cost of about 30 percent more FLOPs from recomputing each checkpointed block.">

<style>

  #fig-training-memory-budget .subtitle{ font:500 10px var(--sans,sans-serif); font-style:italic; fill:var(--v-muted); }
  #fig-training-memory-budget .col-hdr{ font:700 13px var(--sans,sans-serif); }
  #fig-training-memory-budget .col-sub{ font:600 10.5px var(--mono,monospace); fill:var(--v-muted); }
  #fig-training-memory-budget .axis{ font:600 10px var(--mono,monospace); fill:var(--v-muted); }
  #fig-training-memory-budget .ceil-lbl{ font:700 10.5px var(--sans,sans-serif); }
  #fig-training-memory-budget .seg-lbl{ font:600 9.5px var(--sans,sans-serif); fill:var(--ink-soft); }
  #fig-training-memory-budget .seg-note{ font:500 9px var(--sans,sans-serif); font-style:italic; fill:var(--v-muted); }
  #fig-training-memory-budget .brk-note{ font:500 9px var(--sans,sans-serif); font-style:italic; fill:var(--v-muted); }
  #fig-training-memory-budget .dom-lbl{ font:700 9.5px var(--sans,sans-serif); fill:var(--accent); }
  #fig-training-memory-budget .total-lbl{ font:700 13px var(--mono,monospace); }
  #fig-training-memory-budget .story{ font:500 9.3px var(--sans,sans-serif); fill:var(--ink-soft); }
  #fig-training-memory-budget .cost-lbl{ font:700 10px var(--sans,sans-serif); fill:var(--ink-soft); }
  #fig-training-memory-budget .cost-sub{ font:500 9px var(--sans,sans-serif); fill:var(--v-muted); }
  #fig-training-memory-budget .fixed-lbl{ font:500 9.5px var(--sans,sans-serif); fill:var(--v-muted); }
</style>

<text x="390" y="16" text-anchor="middle" class="subtitle">Training memory for ONE micro-batch - illustrative, on the order of, not a precise benchmark</text>

<!-- column headers -->
<g data-anim="1">
  <text x="215" y="40" text-anchor="middle" class="col-hdr">checkpointing OFF</text>
  <text x="215" y="54" text-anchor="middle" class="col-sub">(micro_batch = 32)</text>
  <text x="630" y="40" text-anchor="middle" class="col-hdr">checkpointing ON</text>
  <text x="630" y="54" text-anchor="middle" class="col-sub">(micro_batch = 8)</text>
</g>

<!-- ceilings + axis -->
<g data-anim="1">
  <line x1="60" y1="90" x2="760" y2="90" class="v-grid" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="755" y="84" text-anchor="end" class="ceil-lbl" fill="var(--v-muted)">80 GB - A100</text>

  <path d="M 55,134 l 10,6 l -10,6" fill="none" class="v-grid" stroke-width="1.2"/>
  <text x="70" y="133" class="brk-note">scale compressed</text>
  <text x="70" y="144" class="brk-note">above 30 GB</text>

  <line x1="60" y1="188" x2="760" y2="188" stroke="var(--warn,#e0a106)" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="755" y="182" text-anchor="end" class="ceil-lbl" fill="var(--warn,#e0a106)">24 GB - RTX 4090</text>

  <line x1="60" y1="380" x2="760" y2="380" class="v-stroke" stroke-width="1.4"/>
  <text x="55" y="384" text-anchor="end" class="axis">0 GB</text>
</g>

<!-- ============ OFF bar ============ -->
<g data-anim="2">
  <!-- fixed terms -->
  <rect x="140" y="366.4" width="150" height="13.6" fill="var(--v-muted)" fill-opacity="0.55" stroke="var(--v-stroke)" stroke-width="1"/>
  <!-- residual -->
  <rect x="140" y="350.4" width="150" height="16" fill="var(--accent)" fill-opacity="0.4" stroke="var(--v-stroke)" stroke-width="1"/>
  <!-- swiglu -->
  <rect x="140" y="306.4" width="150" height="44" fill="var(--accent)" fill-opacity="0.62" stroke="var(--v-stroke)" stroke-width="1"/>
  <!-- attn/mlp + logits/z-loss -->
  <rect x="140" y="178.4" width="150" height="128" fill="var(--accent)" fill-opacity="0.85" stroke="var(--v-stroke)" stroke-width="1"/>
  <rect x="140" y="178.4" width="150" height="201.6" fill="none" stroke="var(--v-stroke)" stroke-width="1.3"/>

  <text x="215" y="165" text-anchor="middle" class="total-lbl">~25 GB</text>

  <!-- activations bracket -->
  <path d="M 133,178.4 h-6 v188 h6" fill="none" class="v-stroke" stroke-width="1.2"/>
  <text x="122" y="250" text-anchor="end" class="dom-lbl">ACTIVATIONS</text>
  <text x="122" y="262" text-anchor="end" class="dom-lbl">scales with</text>
  <text x="122" y="274" text-anchor="end" class="dom-lbl">n_layers = 30 -</text>
  <text x="122" y="286" text-anchor="end" class="dom-lbl">dominates</text>

  <!-- segment leader labels -->
  <line x1="290" y1="358.4" x2="300" y2="358.4" class="v-grid" stroke-width="1"/>
  <text x="304" y="356" class="seg-lbl">residual stream x 30</text>
  <text x="304" y="368" class="seg-lbl">blocks ~ 2.0 GB</text>

  <line x1="290" y1="328.4" x2="300" y2="328.4" class="v-grid" stroke-width="1"/>
  <text x="304" y="326" class="seg-lbl">SwiGLU intermediate</text>
  <text x="304" y="338" class="seg-lbl">x 30 blocks ~ 5.5 GB</text>

  <line x1="290" y1="242.4" x2="300" y2="242.4" class="v-grid" stroke-width="1"/>
  <text x="304" y="230" class="seg-lbl">attention / QK-norm / MLP +</text>
  <text x="304" y="242" class="seg-lbl">logits &amp; z-loss fp32 upcast</text>
  <text x="304" y="254" class="seg-note">(B x T x V, once) ~ 16 GB</text>
</g>

<!-- ============ ON bar ============ -->
<g data-anim="3">
  <rect x="555" y="366.4" width="150" height="13.6" fill="var(--v-muted)" fill-opacity="0.55" stroke="var(--v-stroke)" stroke-width="1"/>
  <rect x="555" y="340.8" width="150" height="25.6" fill="var(--accent)" fill-opacity="0.7" stroke="var(--v-stroke)" stroke-width="1"/>
  <rect x="555" y="340.8" width="150" height="39.2" fill="none" stroke="var(--v-stroke)" stroke-width="1.3"/>

  <text x="630" y="296" text-anchor="middle" class="total-lbl">~5 GB</text>
  <rect x="588" y="303" width="84" height="30" rx="5" fill="var(--surface-3)" stroke="var(--border-2)" stroke-width="1"/>
  <text x="630" y="316" text-anchor="middle" class="cost-lbl">+~30% FLOPs</text>
  <text x="630" y="328" text-anchor="middle" class="cost-sub">1 extra fwd / block</text>
</g>

<!-- collapse story: OFF activations -> ON collapsed segment -->
<g data-anim="4">
  <path d="M 296,252 C 330,345 480,345 552,345" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="4 3" stroke-opacity="0.8"/>
  <path d="M 552,345 L 542,338 M 552,345 L 545,353" stroke="var(--accent)" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <text x="420" y="290" class="story">checkpointing stores only block</text>
  <text x="420" y="302" class="story">boundaries and recomputes each</text>
  <text x="420" y="314" class="story">block in backward:</text>
  <text x="420" y="328" class="story">30x residual term -&gt; ~1 block live</text>
</g>

<!-- shared fixed-terms note -->
<g data-anim="5">
  <line x1="215" y1="391" x2="215" y2="376" class="v-grid" stroke-width="1"/>
  <line x1="630" y1="391" x2="630" y2="376" class="v-grid" stroke-width="1"/>
  <text x="422" y="404" text-anchor="middle" class="fixed-lbl">fixed terms (fp32 weights 0.4 + bf16 grads 0.4 + Muon/AdamW optimizer state 0.9 GB) ~ 1.7 GB total -</text>
  <text x="422" y="417" text-anchor="middle" class="fixed-lbl">batch-independent, identical in both bars</text>
  <line x1="120" y1="398" x2="720" y2="398" class="v-grid" stroke-width="0.8" stroke-dasharray="2 3"/>
</g>

</svg>
<figcaption><b>Activations, not weights, dominate training memory - and checkpointing collapses that dominant term.</b>
Weights, gradients, and optimizer state are small, fixed, batch-independent terms; activations scale with
<code>n_layers</code> and (for the logits/z-loss buffer) with batch size, which is why the same 32-sequence
micro-batch that fits comfortably on an 80 GB A100 does not leave room on a 24 GB RTX 4090 - and why that tier
drops to a micro-batch of 8 and turns activation checkpointing on.</figcaption>
</figure>
