<figcaption><b>The (bands, rows) split, not just performance, is what sets the near-duplicate detection threshold.</b> With num_perm=128, bands=16/rows=8 transitions steeply near J~0.71 (climbing from ~0.06 at J=0.5 to ~0.62 at J=0.7 to ~0.95 at J=0.8), while fewer, fatter bands=8/rows=16 shift that transition right to J~0.88 and catch fewer near-duplicates. Candidate generation is deliberately loose and over-generates around J~0.7; the explicit <code>threshold=0.8</code> re-check on the full signature in <code>near_dedup</code> is what actually decides whether a document is dropped.</figcaption>
</figure>
