<figure class="viz" id="fig-overtrain-deployment-economics">
<button class="viz-replay" type="button">/replay</button>
<svg viewBox="0 0 800 500" role="img" aria-label="Two panels. Left: training compute is a single one-time cost while inference compute is a small repeating cost paid on every request forever. Right: a schematic chart where cumulative compute cost for a larger Chinchilla-optimal model starts lower but rises steeply with serving volume, while a smaller over-trained model starts higher but rises slowly, crossing at a break-even serving volume beyond which over-training wins.">
<defs>
  <marker id="ode-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-soft)"/>
  </marker>
</defs>
<style>
  #fig-overtrain-deployment-economics text { fill: var(--ink-soft); }
  #fig-overtrain-deployment-economics .hdr { font: 700 14px var(--sans,sans-serif); }
  #fig-overtrain-deployment-economics .panel-hdr { font: 700 12.5px var(--sans,sans-serif); }
  #fig-overtrain-deployment-economics .lbl { font: 600 11.5px var(--sans,sans-serif); }
  #fig-overtrain-deployment-economics .lbl-sm { font: 500 10.5px var(--sans,sans-serif); fill: var(--muted); }
  #fig-overtrain-deployment-economics .lbl-xs { font: 500 9.5px var(--sans,sans-serif); fill: var(--muted); }
  #fig-overtrain-deployment-economics .pill { font: 700 10px var(--sans,sans-serif); }
  #fig-overtrain-deployment-economics .axis-lbl { font: 600 10.5px var(--sans,sans-serif); fill: var(--muted); }
  #fig-overtrain-deployment-economics .legend-txt { font: 500 10.5px var(--sans,sans-serif); }
  #fig-overtrain-deployment-economics .callout { font: 600 10px var(--sans,sans-serif); }
  #fig-overtrain-deployment-economics .takeaway { font: italic 600 12.5px var(--sans,sans-serif); }
</style>
<text x="400.0" y="24" text-anchor="middle" class="hdr">Deployment economics: why over-train a smaller model past Chinchilla-optimal</text>
<line x1="390" y1="48" x2="390" y2="420" stroke="var(--border-2)" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
<text x="195" y="64" text-anchor="middle" class="panel-hdr">The two kinds of compute</text>
<text x="195" y="86" text-anchor="middle" class="lbl">Training compute ~ 6ND</text>
<text x="195" y="100" text-anchor="middle" class="lbl-sm">paid ONCE -- one big rock you lift once</text>
<rect x="150" y="108" width="90" height="118" rx="6" fill="var(--accent)" fill-opacity="0.5" stroke="var(--accent)" stroke-width="1.6"/>
<line x1="40" y1="226" x2="350" y2="226" stroke="var(--border-2)" stroke-width="1.2"/>
<rect x="252" y="140" width="88" height="34" rx="8" fill="var(--surface-3)" stroke="var(--accent)" stroke-width="1"/>
<text x="296" y="154" text-anchor="middle" class="pill" style="fill:var(--accent)">10x tokens</text>
<text x="296" y="167" text-anchor="middle" class="lbl-xs">(one-time)</text>
<text x="195" y="244" text-anchor="middle" class="lbl">Inference compute ~ scales with N</text>
<text x="195" y="258" text-anchor="middle" class="lbl-sm">paid on EVERY forward pass, forever</text>
<rect x="46" y="274" width="22" height="40" rx="4" fill="var(--accent2)" fill-opacity="0.5" stroke="var(--accent2)" stroke-width="1.4"/>
<rect x="78" y="274" width="22" height="40" rx="4" fill="var(--accent2)" fill-opacity="0.5" stroke="var(--accent2)" stroke-width="1.4"/>
<rect x="110" y="274" width="22" height="40" rx="4" fill="var(--accent2)" fill-opacity="0.5" stroke="var(--accent2)" stroke-width="1.4"/>
<rect x="142" y="274" width="22" height="40" rx="4" fill="var(--accent2)" fill-opacity="0.5" stroke="var(--accent2)" stroke-width="1.4"/>
<rect x="174" y="274" width="22" height="40" rx="4" fill="var(--accent2)" fill-opacity="0.5" stroke="var(--accent2)" stroke-width="1.4"/>
<rect x="206" y="274" width="22" height="40" rx="4" fill="var(--accent2)" fill-opacity="0.5" stroke="var(--accent2)" stroke-width="1.4"/>
<circle cx="242" cy="294.0" r="2.2" fill="var(--muted)"/>
<circle cx="252" cy="294.0" r="2.2" fill="var(--muted)"/>
<circle cx="262" cy="294.0" r="2.2" fill="var(--muted)"/>
<line x1="276" y1="294.0" x2="340" y2="294.0" stroke="var(--ink-soft)" stroke-width="1.4" marker-end="url(#ode-arr)"/>
<line x1="40" y1="314" x2="350" y2="314" stroke="var(--border-2)" stroke-width="1.2"/>
<text x="195" y="338" text-anchor="middle" class="lbl-sm">a small toll, paid on every request --</text>
<text x="195" y="352" text-anchor="middle" class="lbl-sm">inference cost scales with N, endlessly</text>
<text x="595" y="64" text-anchor="middle" class="panel-hdr">The crossover</text>
<rect x="562.0" y="110" width="198.0" height="240" fill="var(--accent2)" fill-opacity="0.07"/>
<line x1="430" y1="350" x2="774" y2="350" stroke="var(--ink-soft)" stroke-width="1.5" marker-end="url(#ode-arr)"/>
<line x1="430" y1="350" x2="430" y2="96" stroke="var(--ink-soft)" stroke-width="1.5" marker-end="url(#ode-arr)"/>
<text x="595.0" y="374" text-anchor="middle" class="axis-lbl">requests served (serving volume)</text>
<text x="416" y="230.0" text-anchor="middle" class="axis-lbl" transform="rotate(-90,416,230.0)">cumulative compute cost</text>
<path d="M430 335.6 L760 122.0" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>
<path d="M430 282.8 L760 201.2" fill="none" stroke="var(--accent2)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 4"/>
<line x1="562.0" y1="250.2" x2="562.0" y2="350" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
<circle cx="562.0" cy="250.2" r="4.5" fill="var(--surface)" stroke="var(--ink-soft)" stroke-width="1.6"/>
<text x="562.0" y="344" text-anchor="middle" class="callout">break-even</text>
<text x="661.0" y="132" text-anchor="middle" class="lbl-sm" style="fill:var(--accent2)">over-training wins here --</text>
<text x="661.0" y="146" text-anchor="middle" class="lbl-sm" style="fill:var(--accent2)">inference savings compound</text>
<line x1="430" y1="395" x2="456" y2="395" stroke="var(--accent)" stroke-width="2.6"/>
<text x="464" y="399" class="legend-txt">Larger model, Chinchilla-optimal (~20 tok/param)</text>
<line x1="430" y1="413" x2="456" y2="413" stroke="var(--accent2)" stroke-width="2.6" stroke-dasharray="7 4"/>
<text x="464" y="417" class="legend-txt">Smaller model, over-trained (~200 tok/param, ~10x tokens)</text>
<line x1="20" y1="440" x2="780" y2="440" stroke="var(--border-2)" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
<text x="400.0" y="464" text-anchor="middle" class="takeaway">Spend compute where it's cheap (training, once) to save it where it's expensive (inference, forever).</text>
</svg>
<figcaption><b>Training compute is paid once; inference compute is paid on every request, forever.</b> A Chinchilla-optimal larger model is cheaper to train but costs more per served request, while a smaller model over-trained roughly 10x past Chinchilla (~200 vs ~20 tokens/param) costs more up front but far less per request; past a break-even serving volume, the over-trained model's compounding inference savings win.</figcaption>
</figure>
