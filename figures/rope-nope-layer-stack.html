  <text x="240" y="212" class="lbl">why a NoPE layer still knows position</text>
  <text x="240" y="230" class="small">causal mask already leaks absolute position (a token sees</text>
  <text x="240" y="243" class="small">only its predecessors -&gt; its count is a position signal);</text>
  <text x="240" y="260" class="small">NoPE layers aren't tied to training rotation frequencies</text>
  <text x="240" y="273" class="small">-&gt; they extrapolate to longer sequences than trained.</text>
</g>

  <text x="390" y="645" text-anchor="middle" class="lbl" fill="var(--warn,#e0a106)">pure NoPE underperforms on SHORT context -- that's why we interleave, not remove.</text>

</svg>
<figcaption><b>7 of the 30 layers (every 4th: indices 3, 7, 11, 15, 19, 23, 27) drop RoPE entirely, relying on the causal mask's implicit position signal instead.</b> The remaining 23 RoPE layers keep sharp local relative-position precision for sample-efficient short-context modeling, while the interleaved NoPE layers -- untied from the training rotation frequencies -- are what let mid-training extend the context from 2048 to 8192.</figcaption>
</figure>
