<figure class="viz" id="fig-grpo-group-advantage-arith">
<button class="viz-replay" type="button">&#x21BB; replay</button>
<svg viewBox="0 0 800 760" role="img" aria-label="A four-step GRPO pipeline on an arithmetic prompt: sample a group of 8 completions, grade each with the exact-match verifier, standardize rewards into z-score advantages, and broadcast the single scalar advantage to every token of a response. A cold-start band below shows that all-wrong and all-right groups give zero gradient and only mixed-outcome groups teach anything.">
<defs>
  <marker id="ga-up" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M5,0 L10,9 L0,9 Z" fill="var(--good,#2f9e6e)"/>
  </marker>
  <marker id="ga-down" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,1 L10,1 L5,10 Z" fill="var(--warn,#e0a106)"/>
  </marker>
  <marker id="ga-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,1 L9,5 L0,9 Z" fill="var(--muted,#6d675d)"/>
  </marker>
</defs>
<style>

  #fig-grpo-group-advantage-arith .mono { font: 600 9.5px var(--mono,monospace); }
  #fig-grpo-group-advantage-arith .lab  { font: 400 9px var(--sans,sans-serif); fill: var(--muted,#6d675d); }

  #fig-grpo-group-advantage-arith .num  { font: 700 10px var(--mono,monospace); }
  #fig-grpo-group-advantage-arith .bandttl { font: 700 10.5px var(--sans,sans-serif); }

  @keyframes ga-fi { from{opacity:0} to{opacity:1} }
  #fig-grpo-group-advantage-arith [data-anim="1"] { animation: ga-fi .4s ease .1s both; }
  #fig-grpo-group-advantage-arith [data-anim="2"] { animation: ga-fi .4s ease .8s both; }

  @media (prefers-reduced-motion: reduce) {

  }
</style>

<!-- STEP 1: PROMPT -->
<g data-anim="1">

  <text x="30" y="50" class="mono">Compute 17 * 4.</text>
  <text x="30" y="64" class="mono">Give the final</text>
  <text x="30" y="78" class="mono">integer after</text>
  <text x="30" y="92" class="mono">'####'</text>
  <rect x="20" y="100" width="150" height="16" rx="4" fill="var(--surface-3,#ece7da)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="95" y="112" text-anchor="middle" class="mono">gold = 68</text>
</g>

<!-- arrow step1 -> step2 -->

<!-- arrow step2 -> step3 -->
<line data-anim="3" x1="580" y1="130" x2="580" y2="130" stroke="none"/>

<!-- STEP 3: STANDARDIZE, right column top -->
<g data-anim="3">
  <text x="470" y="24" class="stepn">STEP 3 -- STANDARDIZE</text>
  <text x="470" y="40" class="lab">A_hat_i = (R_i - mean)/(std + eps)</text>

  <rect x="652" y="120" width="16" height="30" rx="2" fill="var(--warn,#e0a106)" fill-opacity=".55" stroke="var(--warn,#e0a106)" stroke-width="1.2"/>

  <text x="470" y="188" class="cap">More wrong than right, so each</text>
  <text x="470" y="201" class="cap">correct sample is pushed up harder</text>
  <text x="470" y="214" class="cap">than each wrong is pushed down --</text>
  <text x="470" y="227" class="capb">the group self-balances.</text>

<!-- STEP 4: BROADCAST -->

  <text x="520" y="550" class="cap">base+SFT model must already</text>
  <text x="520" y="564" class="cap">succeed SOMETIMES.</text>
  <text x="520" y="586" class="capb">This is why the task must be</text>
  <text x="520" y="600" class="capb">narrow and in-distribution at</text>

<figcaption><b>GRPO on the arithmetic task: sample a group of G=8 completions, grade each with the exact-match verifier, standardize rewards into z-score advantages, and broadcast one scalar per response to every one of its tokens.</b> With R = [1,0,1,0,0,1,0,0] (37.5% correct, the RLVR sweet spot), the three correct samples get advantage +1.29 and the five wrong ones get -0.775 -- more wrong than right, so each correct sample is pushed up harder than each wrong one is pushed down. The cold-start band shows why this only works when groups are mixed: all-wrong or all-right groups have zero variance, so every standardized advantage is exactly zero and the prompt contributes no gradient at all.</figcaption>
