<figure class="viz" id="fig-gqa-head-sharing-kv-cache">
<button class="viz-replay" type="button">/replay</button>
<svg viewBox="0 0 780 460" role="img" aria-label="Eight query heads sharing two KV heads in a four to one grouping, positioned on the MHA to MQA spectrum, with a to-scale comparison showing the GQA KV cache at thirty kilobytes per token is four times smaller than the one hundred twenty kilobyte MHA cache.">
<style>
  #fig-gqa-head-sharing-kv-cache text     { fill: var(--ink-soft,#45413a); }
  #fig-gqa-head-sharing-kv-cache .ttl     { font: 700 15.5px var(--sans,sans-serif); fill: currentColor; }
  #fig-gqa-head-sharing-kv-cache .sub     { font: 500 11px var(--sans,sans-serif); fill: var(--muted,#6d675d); }
  #fig-gqa-head-sharing-kv-cache .hdr     { font: 700 12px var(--sans,sans-serif); }
  #fig-gqa-head-sharing-kv-cache .lbl     { font: 600 10.5px var(--sans,sans-serif); }
  #fig-gqa-head-sharing-kv-cache .small   { font: 500 9.5px var(--sans,sans-serif); fill: var(--muted,#6d675d); }
  #fig-gqa-head-sharing-kv-cache .mono    { font: 600 9.5px var(--mono,monospace); }
  #fig-gqa-head-sharing-kv-cache .tag     { font: 700 10px var(--sans,sans-serif); }
</style>

<text x="20" y="24" class="ttl">GQA: 8 query heads share 2 KV heads</text>
<text x="20" y="41" class="sub">The middle of the MHA to MQA spectrum -- and the concrete consequence for the KV cache.</text>

<g data-anim="1">
  <rect x="90" y="52" width="600" height="16" rx="8" fill="var(--surface-3,#ece7da)" stroke="var(--border-2,#d8d1c0)" stroke-width="1"/>
  <text x="105" y="64" class="small">MHA (8 KV, max quality/max cache)</text>
  <text x="390" y="64" text-anchor="middle" class="small" fill="var(--accent,#c15b39)" font-weight="700">[GQA 2 KV, here]</text>
  <text x="675" y="64" text-anchor="middle" class="small">MQA (1 KV, min cache)</text>
</g>

<g data-anim="2">
  <text x="20" y="98" class="hdr">head routing</text>


  <g>
    <rect x="80"  y="112" width="52" height="26" rx="4" class="v-fill" stroke="var(--v-muted,#6d675d)" stroke-width="1.1"/>
    <text x="106" y="129" text-anchor="middle" class="mono">Q0</text>
    <rect x="140" y="112" width="52" height="26" rx="4" class="v-fill" stroke="var(--v-muted,#6d675d)" stroke-width="1.1"/>
    <text x="166" y="129" text-anchor="middle" class="mono">Q1</text>
    <rect x="200" y="112" width="52" height="26" rx="4" class="v-fill" stroke="var(--v-muted,#6d675d)" stroke-width="1.1"/>
    <text x="226" y="129" text-anchor="middle" class="mono">Q2</text>
    <rect x="260" y="112" width="52" height="26" rx="4" class="v-fill" stroke="var(--v-muted,#6d675d)" stroke-width="1.1"/>
    <text x="286" y="129" text-anchor="middle" class="mono">Q3</text>

    <rect x="340" y="112" width="52" height="26" rx="4" class="v-fill" stroke="var(--v-muted,#6d675d)" stroke-width="1.1"/>
    <text x="366" y="129" text-anchor="middle" class="mono">Q4</text>
    <rect x="400" y="112" width="52" height="26" rx="4" class="v-fill" stroke="var(--v-muted,#6d675d)" stroke-width="1.1"/>
    <text x="426" y="129" text-anchor="middle" class="mono">Q5</text>
    <rect x="460" y="112" width="52" height="26" rx="4" class="v-fill" stroke="var(--v-muted,#6d675d)" stroke-width="1.1"/>
    <text x="486" y="129" text-anchor="middle" class="mono">Q6</text>
    <rect x="520" y="112" width="52" height="26" rx="4" class="v-fill" stroke="var(--v-muted,#6d675d)" stroke-width="1.1"/>
    <text x="546" y="129" text-anchor="middle" class="mono">Q7</text>
  </g>


  <line x1="106" y1="138" x2="200" y2="180" stroke="var(--v-muted,#6d675d)" stroke-width="1.1"/>
  <line x1="166" y1="138" x2="200" y2="180" stroke="var(--v-muted,#6d675d)" stroke-width="1.1"/>
  <line x1="226" y1="138" x2="200" y2="180" stroke="var(--v-muted,#6d675d)" stroke-width="1.1"/>
  <line x1="286" y1="138" x2="200" y2="180" stroke="var(--v-muted,#6d675d)" stroke-width="1.1"/>

  <line x1="366" y1="138" x2="450" y2="180" stroke="var(--v-muted,#6d675d)" stroke-width="1.1"/>
  <line x1="426" y1="138" x2="450" y2="180" stroke="var(--v-muted,#6d675d)" stroke-width="1.1"/>
  <line x1="486" y1="138" x2="450" y2="180" stroke="var(--v-muted,#6d675d)" stroke-width="1.1"/>
  <line x1="546" y1="138" x2="450" y2="180" stroke="var(--v-muted,#6d675d)" stroke-width="1.1"/>

  <rect x="164" y="180" width="72" height="30" rx="5" fill="var(--accent,#c15b39)" fill-opacity="0.85"/>
  <text x="200" y="200" text-anchor="middle" class="lbl" fill="var(--surface,#fff)">KV0</text>
  <rect x="414" y="180" width="72" height="30" rx="5" fill="var(--accent,#c15b39)" fill-opacity="0.85"/>
  <text x="450" y="200" text-anchor="middle" class="lbl" fill="var(--surface,#fff)">KV1</text>

  <text x="325" y="228" text-anchor="middle" class="small">groups = 8 / 2 = 4 query heads per KV head</text>

  <rect x="596" y="170" width="164" height="52" rx="5" fill="var(--surface-3,#ece7da)" fill-opacity="0.5" stroke="var(--border-2,#d8d1c0)" stroke-width="1"/>
  <text x="604" y="184" class="small">K,V computed narrow</text>
  <text x="604" y="196" class="small">(512-&gt;128) then shared; a</text>
  <text x="604" y="208" class="small">real kernel reads the shared</text>
  <text x="604" y="220" class="small">KV head directly.</text>
</g>

<g data-anim="3">
  <line x1="20" y1="244" x2="760" y2="244" stroke="var(--border-2,#d8d1c0)" stroke-width="1"/>
  <text x="20" y="266" class="hdr">KV cache footprint per token (30 layers, bf16) -- bars drawn to scale</text>

  <text x="150" y="290" text-anchor="middle" class="small">GQA (2 KV heads)</text>
  <rect x="150" y="298" width="60" height="24" rx="3" fill="var(--accent,#c15b39)"/>
  <text x="220" y="315" class="mono">2(K,V) x 2 x 64 x 30 x 2B = ~30 KB/token</text>

  <text x="150" y="352" text-anchor="middle" class="small">MHA (8 KV heads)</text>
  <rect x="150" y="360" width="240" height="24" rx="3" fill="var(--v-muted,#6d675d)"/>
  <text x="405" y="377" class="mono">~120 KB/token</text>

  <line x1="150" y1="392" x2="390" y2="392" stroke="var(--v-muted,#6d675d)" stroke-width="1"/>
  <line x1="150" y1="388" x2="150" y2="396" stroke="var(--v-muted,#6d675d)" stroke-width="1"/>
  <line x1="390" y1="388" x2="390" y2="396" stroke="var(--v-muted,#6d675d)" stroke-width="1"/>
  <text x="270" y="408" text-anchor="middle" class="tag" fill="var(--accent,#c15b39)">4x</text>
</g>

<g data-anim="4">
  <rect x="20" y="424" width="740" height="26" rx="5" fill="var(--surface-3,#ece7da)" fill-opacity="0.4" stroke="var(--border-2,#d8d1c0)" stroke-width="1"/>
  <text x="390" y="441" text-anchor="middle" class="lbl">full 2048-context: ~60 MB (GQA) vs ~240 MB (MHA) -- the win that makes it cheap to serve</text>
</g>

</svg>
<figcaption><b>8 query heads route into just 2 KV heads (a 4:1 group), and that sharing shrinks the per-token KV cache to about a quarter of full multi-head attention.</b> GQA sits between MHA (one KV head per query head, maximal cache) and MQA (a single shared KV head, minimal cache); at 2 KV heads Stack-100M keeps near-MHA quality while paying only ~30 KB/token instead of ~120 KB/token, or ~60 MB instead of ~240 MB across a full 2048-token context.</figcaption>
</figure>
