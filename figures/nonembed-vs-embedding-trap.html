<figure class="viz" id="fig-nonembed-vs-embedding-trap">
<button class="viz-replay" type="button">↻ replay</button>
<svg viewBox="0 0 760 470" role="img" aria-label="A stacked bar chart across the four ladder rungs plus the target model: a fixed 16.8 million parameter tied embedding table sits at the bottom of every bar at identical height, while a growing non-embedding blocks segment is stacked on top. At the smallest rung the embedding is about four times the entire rest of the model; by the target it is down to about seventeen percent of the total.">
<style>
  #fig-nonembed-vs-embedding-trap text{ fill:var(--ink-soft,#374151); font-family:var(--sans,sans-serif); }
  #fig-nonembed-vs-embedding-trap .leg  { font:500 8.6px var(--sans,sans-serif); }
  #fig-nonembed-vs-embedding-trap .ax   { font:600 10.5px var(--sans,sans-serif); }
  #fig-nonembed-vs-embedding-trap .tick { font:500 8.4px var(--mono,monospace); fill:var(--muted,#9ca3af); }
  #fig-nonembed-vs-embedding-trap .tick-hi { font:700 8.6px var(--mono,monospace); fill:var(--good,#2f9e6e); }
  #fig-nonembed-vs-embedding-trap .rung { font:700 10px var(--sans,sans-serif); }
  #fig-nonembed-vs-embedding-trap .rungv{ font:500 8px var(--mono,monospace); fill:var(--muted,#9ca3af); }
  #fig-nonembed-vs-embedding-trap .pct  { font:700 10.5px var(--sans,sans-serif); fill:var(--ink-soft,#374151); }
  #fig-nonembed-vs-embedding-trap .total{ font:600 7.8px var(--mono,monospace); fill:var(--muted,#9ca3af); }
  #fig-nonembed-vs-embedding-trap .cbox { font:600 8.4px var(--sans,sans-serif); fill:var(--ink-soft,#374151); }
  #fig-nonembed-vs-embedding-trap .cap  { font:600 9.5px var(--sans,sans-serif); fill:var(--ink-soft,#374151); }
</style>

<!-- legend, doubling as the two role labels -->
<g data-anim="1">
  <rect x="16" y="12" width="12" height="10" rx="2" fill="var(--muted,#9ca3af)" fill-opacity="0.4" stroke="var(--muted,#9ca3af)" stroke-width="1"/>
  <text x="33" y="21" class="leg">embedding (fixed, 16.8M per rung) -- fixed work per token, no depth-driven capacity scaling</text>
  <rect x="16" y="26" width="12" height="10" rx="2" fill="var(--accent,#c15b39)" fill-opacity="0.55" stroke="var(--accent,#c15b39)" stroke-width="1"/>
  <text x="33" y="35" class="leg">blocks / non-embedding N (grows) -- the sequence-mixing + feature-transform params the 6ND rule counts</text>
</g>

<!-- axes -->
<g data-anim="1">
  <line x1="90" y1="40" x2="90" y2="380" stroke="var(--ink-soft,#45413a)" stroke-width="1.6"/>
  <line x1="90" y1="380" x2="730" y2="380" stroke="var(--ink-soft,#45413a)" stroke-width="1.6"/>

  <g stroke="var(--v-grid,#d8d1c0)" stroke-width="1" opacity="0.5">
    <line x1="90" y1="256.4" x2="730" y2="256.4"/>
    <line x1="90" y1="194.5" x2="730" y2="194.5"/>
    <line x1="90" y1="132.7" x2="730" y2="132.7"/>
    <line x1="90" y1="70.9"  x2="730" y2="70.9"/>
  </g>
  <text x="82" y="383" text-anchor="end" class="tick">0</text>
  <text x="82" y="259.4" text-anchor="end" class="tick">40</text>
  <text x="82" y="197.5" text-anchor="end" class="tick">60</text>
  <text x="82" y="135.7" text-anchor="end" class="tick">80</text>
  <text x="82" y="73.9"  text-anchor="end" class="tick">100</text>

  <text x="24" y="212" text-anchor="middle" class="ax" transform="rotate(-90 24 212)">parameters (M)</text>
</g>

<!-- the constant-embedding guide line, called out on the y-axis -->
<g data-anim="2">
  <line x1="90" y1="328.13" x2="730" y2="328.13" stroke="var(--good,#2f9e6e)" stroke-width="1.2" stroke-dasharray="5 3" opacity="0.8"/>
  <text x="82" y="331" text-anchor="end" class="tick-hi">16.8</text>
</g>

<!-- bars: embedding at bottom (identical height), blocks stacked on top -->
<g data-anim="2">
  <!-- S1 -->
  <rect x="110" y="328.13" width="80" height="51.87" fill="var(--muted,#9ca3af)" fill-opacity="0.4" stroke="var(--muted,#9ca3af)" stroke-width="1"/>
  <rect x="110" y="315.98" width="80" height="12.15" fill="var(--accent,#c15b39)" fill-opacity="0.55" stroke="var(--accent,#c15b39)" stroke-width="1"/>
  <text x="150" y="357" text-anchor="middle" class="pct">81%</text>
  <text x="150" y="309" text-anchor="middle" class="total">20.7M total</text>

  <!-- S2 -->
  <rect x="240" y="328.13" width="80" height="51.87" fill="var(--muted,#9ca3af)" fill-opacity="0.4" stroke="var(--muted,#9ca3af)" stroke-width="1"/>
  <rect x="240" y="299.81" width="80" height="28.32" fill="var(--accent,#c15b39)" fill-opacity="0.55" stroke="var(--accent,#c15b39)" stroke-width="1"/>
  <text x="280" y="357" text-anchor="middle" class="pct">65%</text>
  <text x="280" y="293" text-anchor="middle" class="total">25.9M total</text>

  <!-- S3 -->
  <rect x="370" y="328.13" width="80" height="51.87" fill="var(--muted,#9ca3af)" fill-opacity="0.4" stroke="var(--muted,#9ca3af)" stroke-width="1"/>
  <rect x="370" y="270.02" width="80" height="58.11" fill="var(--accent,#c15b39)" fill-opacity="0.55" stroke="var(--accent,#c15b39)" stroke-width="1"/>
  <text x="410" y="357" text-anchor="middle" class="pct">47%</text>
  <text x="410" y="263" text-anchor="middle" class="total">35.6M total</text>

  <!-- S4 -->
  <rect x="500" y="328.13" width="80" height="51.87" fill="var(--muted,#9ca3af)" fill-opacity="0.4" stroke="var(--muted,#9ca3af)" stroke-width="1"/>
  <rect x="500" y="192.28" width="80" height="135.85" fill="var(--accent,#c15b39)" fill-opacity="0.55" stroke="var(--accent,#c15b39)" stroke-width="1"/>
  <text x="540" y="357" text-anchor="middle" class="pct">28%</text>
  <text x="540" y="185" text-anchor="middle" class="total">60.7M total</text>

  <!-- target -->
  <rect x="630" y="328.13" width="80" height="51.87" fill="var(--muted,#9ca3af)" fill-opacity="0.4" stroke="var(--muted,#9ca3af)" stroke-width="1"/>
  <rect x="630" y="66.79" width="80" height="261.34" fill="var(--accent,#c15b39)" fill-opacity="0.55" stroke="var(--accent,#c15b39)" stroke-width="1"/>
  <text x="670" y="357" text-anchor="middle" class="pct">17%</text>
  <text x="670" y="60" text-anchor="middle" class="total">101.3M total</text>
</g>

<!-- x-axis rung labels -->
<g data-anim="1">
  <text x="150" y="397" text-anchor="middle" class="rung">S1</text>
  <text x="150" y="409" text-anchor="middle" class="rungv">3.9M blocks</text>
  <text x="280" y="397" text-anchor="middle" class="rung">S2</text>
  <text x="280" y="409" text-anchor="middle" class="rungv">9.2M blocks</text>
  <text x="410" y="397" text-anchor="middle" class="rung">S3</text>
  <text x="410" y="409" text-anchor="middle" class="rungv">18.8M blocks</text>
  <text x="540" y="397" text-anchor="middle" class="rung">S4</text>
  <text x="540" y="409" text-anchor="middle" class="rungv">44M blocks</text>
  <text x="670" y="397" text-anchor="middle" class="rung" fill="var(--accent2,#3b82f6)">target</text>
  <text x="670" y="409" text-anchor="middle" class="rungv">84.5M blocks</text>
</g>

<!-- the punchline callout on S1 -->
<g data-anim="3">
  <path d="M150 95 L150 322" fill="none" stroke="var(--ink-soft,#45413a)" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  <rect x="95" y="54" width="250" height="41" rx="6" fill="var(--surface,#fff)" stroke="var(--border-2,#d1d5db)" stroke-width="1"/>
  <text x="105" y="70" class="cbox">S1: the embedding (16.8M) is ~4x</text>
  <text x="105" y="83" class="cbox">the entire rest of the model (3.9M)</text>
</g>

<!-- bottom caption -->
<g data-anim="3">
  <rect x="60" y="430" width="640" height="26" rx="6" fill="var(--v-grid,#d8d1c0)" opacity="0.4"/>
  <text x="380" y="447" text-anchor="middle" class="cap">fit the law on NON-EMBEDDING N (the blocks slab) -- counting the embedding corrupts the exponent</text>
</g>

<style>
@media (prefers-reduced-motion: reduce) {
  #fig-nonembed-vs-embedding-trap [data-anim] { opacity: 1 !important; animation: none !important; }
}
</style>
</svg>
<figcaption><b>The tied 32,768-vocabulary embedding is a fixed 16.8M-parameter table on every rung, while the transformer blocks grow with depth.</b> At the smallest rung that fixed slab is nearly four times the rest of the model (81% of total parameters); by the target it has shrunk to 17%. Fitting the scaling law on total parameters lets this depth-independent, per-token-constant embedding swamp the capacity signal &#8212; the fix is to fit on non-embedding N alone.</figcaption>
</figure>
