<figcaption><b>A scaling law fit on four small models predicts the 100M model's loss to 0.002 nats.</b> Measured on one H100 (this book's own text as the training corpus): the ladder (S1&ndash;S4, 3.9M&ndash;44M non-embedding params) was trained under one recipe at a matched ~20M-token budget; fitting $L(N)=E+A/N^{\alpha}$ to those four points and extrapolating to Stack-100M's 84.6M non-embedding params predicts 1.945, and the model actually trained to 1.947. The exponent itself is loosely constrained by only four points, but the held-out extrapolation is robust &mdash; which is exactly why you run a ladder before spending the full budget.</figcaption>
