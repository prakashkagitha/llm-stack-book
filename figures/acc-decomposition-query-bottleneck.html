<figure class="viz" id="fig-acc-decomposition-query-bottleneck">
<button class="viz-replay" type="button">↻ replay</button>
<svg viewBox="0 0 800 520" role="img" aria-label="End-to-end accuracy decomposed into five multiplied per-stage success probabilities: well-formed call 0.95, good query 0.75, reads observation 0.90, correct calc 0.98, clean synthesis 0.90, illustrative not benchmarked. A meter above each stage encodes its probability. The running product shrinks left to right from 0.95 to 0.71 to 0.64 to 0.63 to about 0.57. The good-query stage is highlighted as the dominant bottleneck since it is the one cognitive step that cannot be offloaded to a tool.">
<defs>
  <marker id="adq-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/>
  </marker>
</defs>
<style>
  #fig-acc-decomposition-query-bottleneck text{ fill:var(--ink-soft); font:400 11px var(--sans,sans-serif); }
  #fig-acc-decomposition-query-bottleneck .h1{ font:700 15px var(--sans,sans-serif); }
  #fig-acc-decomposition-query-bottleneck .sub{ font:400 11px var(--sans,sans-serif); fill:var(--muted); }
  #fig-acc-decomposition-query-bottleneck .val{ font:700 12px var(--mono,monospace); }
  #fig-acc-decomposition-query-bottleneck .mult{ font:700 16px var(--sans,sans-serif); fill:var(--muted); }
  #fig-acc-decomposition-query-bottleneck .node-lbl{ font:700 11px var(--sans,sans-serif); fill:var(--surface); }
  #fig-acc-decomposition-query-bottleneck .rp-lbl{ font:700 10px var(--sans,sans-serif); letter-spacing:.04em; fill:var(--muted); }
  #fig-acc-decomposition-query-bottleneck .rp-val{ font:700 11.5px var(--mono,monospace); fill:var(--ink-soft); }
  #fig-acc-decomposition-query-bottleneck .tag{ font:500 9.5px var(--sans,sans-serif); fill:var(--muted); }
  #fig-acc-decomposition-query-bottleneck .bn-hd{ font:700 11.5px var(--sans,sans-serif); fill:var(--accent); }
  #fig-acc-decomposition-query-bottleneck .bn{ font:500 10.5px var(--sans,sans-serif); fill:var(--ink-soft); }
  #fig-acc-decomposition-query-bottleneck .final{ font:700 13px var(--mono,monospace); fill:var(--surface); }
  #fig-acc-decomposition-query-bottleneck .caption-band{ font:700 12.5px var(--sans,sans-serif); fill:var(--surface); }
</style>

<!-- TITLE -->
<text x="16" y="24" class="h1">Where the accuracy goes: a multiplicative chain of stage probabilities</text>
<text x="16" y="41" class="sub">illustrative, not benchmarked -- a mental model for the worked example in the text</text>

<!-- near-solved tags (above the chain) -->
<g data-anim="1">
<text x="112" y="62" text-anchor="middle" class="tag">well-formed call 0.95 =</text>
<text x="112" y="74" text-anchor="middle" class="tag">regularized format</text>
<line x1="112" y1="80" x2="112" y2="118" stroke="var(--border-2)" stroke-width="1" stroke-dasharray="2,2"/>

<text x="544" y="62" text-anchor="middle" class="tag">correct calc 0.98 =</text>
<text x="544" y="74" text-anchor="middle" class="tag">offloaded to a tool</text>
<line x1="544" y1="80" x2="544" y2="118" stroke="var(--border-2)" stroke-width="1" stroke-dasharray="2,2"/>
</g>

<!-- ============ METERS + MULT SIGNS ============ -->
<g data-anim="2">
<!-- stage 1: well-formed call 0.95 -->
<rect x="92" y="120" width="40" height="120" rx="4" fill="var(--surface-3)" stroke="var(--border-2)" stroke-width="1.2"/>
<rect x="92" y="126" width="40" height="114" rx="4" class="v-accent"/>
<text x="112" y="254" text-anchor="middle" class="val">0.95</text>

<text x="184" y="192" text-anchor="middle" class="mult">x</text>

<!-- stage 2: good query 0.75, THE BOTTLENECK -->
<rect x="236" y="120" width="40" height="120" rx="4" fill="var(--surface-3)" stroke="var(--accent)" stroke-width="2.2"/>
<rect x="236" y="150" width="40" height="90" rx="4" class="v-accent"/>
<text x="256" y="254" text-anchor="middle" class="val" fill="var(--accent)">0.75</text>

<text x="328" y="192" text-anchor="middle" class="mult">x</text>

<!-- stage 3: reads observation 0.90 -->
<rect x="380" y="120" width="40" height="120" rx="4" fill="var(--surface-3)" stroke="var(--border-2)" stroke-width="1.2"/>
<rect x="380" y="132" width="40" height="108" rx="4" class="v-accent"/>
<text x="400" y="254" text-anchor="middle" class="val">0.90</text>

<text x="472" y="192" text-anchor="middle" class="mult">x</text>

<!-- stage 4: correct calc 0.98 -->
<rect x="524" y="120" width="40" height="120" rx="4" fill="var(--surface-3)" stroke="var(--border-2)" stroke-width="1.2"/>
<rect x="524" y="122" width="40" height="118" rx="4" class="v-accent"/>
<text x="544" y="254" text-anchor="middle" class="val">0.98</text>

<text x="616" y="192" text-anchor="middle" class="mult">x</text>

<!-- stage 5: clean synth 0.90 -->
<rect x="668" y="120" width="40" height="120" rx="4" fill="var(--surface-3)" stroke="var(--border-2)" stroke-width="1.2"/>
<rect x="668" y="132" width="40" height="108" rx="4" class="v-accent"/>
<text x="688" y="254" text-anchor="middle" class="val">0.90</text>
</g>

<!-- node name boxes -->
<g data-anim="2">
<rect x="72" y="266" width="80" height="40" rx="6" class="v-accent"/>
<text x="112" y="282" text-anchor="middle" class="node-lbl">well-formed</text>
<text x="112" y="298" text-anchor="middle" class="node-lbl">call</text>

<rect x="216" y="266" width="80" height="40" rx="6" fill="var(--accent)" stroke="var(--accent)" stroke-width="2"/>
<text x="256" y="282" text-anchor="middle" class="node-lbl">good</text>
<text x="256" y="298" text-anchor="middle" class="node-lbl">query</text>

<rect x="360" y="266" width="80" height="40" rx="6" class="v-accent"/>
<text x="400" y="282" text-anchor="middle" class="node-lbl">reads</text>
<text x="400" y="298" text-anchor="middle" class="node-lbl">obs</text>

<rect x="504" y="266" width="80" height="40" rx="6" class="v-accent"/>
<text x="544" y="282" text-anchor="middle" class="node-lbl">correct</text>
<text x="544" y="298" text-anchor="middle" class="node-lbl">calc</text>

<rect x="648" y="266" width="80" height="40" rx="6" class="v-accent"/>
<text x="688" y="282" text-anchor="middle" class="node-lbl">clean</text>
<text x="688" y="298" text-anchor="middle" class="node-lbl">synth</text>
</g>

<!-- ============ RUNNING PRODUCT ============ -->
<g data-anim="3">
<text x="16" y="332" class="rp-lbl">RUNNING PRODUCT, LEFT TO RIGHT</text>

<rect x="82" y="340" width="60" height="26" rx="5" fill="var(--surface-3)" stroke="var(--border-2)" stroke-width="1.1"/>
<text x="112" y="358" text-anchor="middle" class="rp-val">0.95</text>
<line x1="145" y1="353" x2="223" y2="353" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#adq-arrow)"/>

<rect x="226" y="340" width="60" height="26" rx="5" fill="var(--surface-3)" stroke="var(--border-2)" stroke-width="1.1"/>
<text x="256" y="358" text-anchor="middle" class="rp-val">0.71</text>
<line x1="289" y1="353" x2="367" y2="353" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#adq-arrow)"/>

<rect x="370" y="340" width="60" height="26" rx="5" fill="var(--surface-3)" stroke="var(--border-2)" stroke-width="1.1"/>
<text x="400" y="358" text-anchor="middle" class="rp-val">0.64</text>
<line x1="433" y1="353" x2="511" y2="353" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#adq-arrow)"/>

<rect x="514" y="340" width="60" height="26" rx="5" fill="var(--surface-3)" stroke="var(--border-2)" stroke-width="1.1"/>
<text x="544" y="358" text-anchor="middle" class="rp-val">0.63</text>
<line x1="577" y1="353" x2="631" y2="353" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#adq-arrow)"/>

<rect x="634" y="336" width="140" height="34" rx="6" class="v-accent"/>
<text x="704" y="358" text-anchor="middle" class="final">Acc_e2e ~= 0.57</text>
</g>

<!-- ============ BOTTLENECK CALLOUT ============ -->
<g data-anim="4">
<line x1="256" y1="306" x2="256" y2="392" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="3,3"/>
<rect x="130" y="392" width="252" height="56" rx="8" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"/>
<text x="256" y="410" text-anchor="middle" class="bn-hd">THE BOTTLENECK</text>
<text x="256" y="426" text-anchor="middle" class="bn">the one cognitive step you can't offload --</text>
<text x="256" y="440" text-anchor="middle" class="bn">it bounds the whole system</text>
</g>

<!-- caption band -->
<rect x="16" y="472" width="768" height="34" rx="6" class="v-accent"/>
<text x="400" y="494" text-anchor="middle" class="caption-band">tool use offloads what small models fail at; the residual is the reasoning you couldn't offload</text>

</svg>
<figcaption><b>End-to-end accuracy is a chain of per-stage success probabilities multiplied together.</b> Arithmetic and format are nearly solved because they were offloaded to a tool or regularized by training data, but <code>good query</code> is the dominant residual bottleneck -- the one genuinely cognitive step a 100M model cannot offload, and it single-handedly drags the running product from 0.95 down toward 0.57.</figcaption>
</figure>
