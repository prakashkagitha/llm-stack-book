<figure class="viz" id="fig-capstone-cost-anatomy">
<button class="viz-replay" type="button">/replay</button>
<svg viewBox="0 0 800 380" role="img" aria-label="A stacked horizontal bar totaling about 100 dollars, segmented into the capstone's cost stages: pretrain 39.60 dollars split into a 4 dollar Chinchilla-optimal floor and 36 dollars of deliberate over-training, mid-training 8.10, scaling-law ladder 8.10, agent distillation 9.80 (1.80 GPU plus 8.00 teacher API), GRPO 5.40, SFT plus DPO plus eval/quant plus tokenizer grouped at 6.66, storage and egress 5.00, and a re-run reality tax of 17.40 dollars.">
  <style>
    #fig-capstone-cost-anatomy .ttl{ font:700 14.5px var(--sans,sans-serif); }
    #fig-capstone-cost-anatomy .lgd{ font:600 10px var(--sans,sans-serif); }
    #fig-capstone-cost-anatomy .name{ font:700 10px var(--sans,sans-serif); }
    #fig-capstone-cost-anatomy .amt{ font:600 9.5px var(--mono,monospace); }
    #fig-capstone-cost-anatomy .inbar{ font:700 9.5px var(--sans,sans-serif); }
    #fig-capstone-cost-anatomy .inbar2{ font:500 8.6px var(--sans,sans-serif); }
    #fig-capstone-cost-anatomy .call{ font:500 9.6px var(--sans,sans-serif); }
    #fig-capstone-cost-anatomy .call-b{ font:700 10px var(--sans,sans-serif); }
    #fig-capstone-cost-anatomy .tick{ font:600 9.5px var(--mono,monospace); }
    #fig-capstone-cost-anatomy .side{ font:500 10.3px var(--sans,sans-serif); }
    #fig-capstone-cost-anatomy .side-b{ font:700 10.3px var(--sans,sans-serif); }
    #fig-capstone-cost-anatomy text{ fill: var(--ink-soft); }
    #fig-capstone-cost-anatomy .dim{ fill: var(--muted); }
    #fig-capstone-cost-anatomy .lead{ stroke: var(--v-grid); stroke-width: 1; }
  </style>

  <text x="400" y="20" text-anchor="middle" class="ttl">Anatomy of the ~$100 model: where the bill actually goes</text>

  <!-- category legend -->
  <g>
    <rect x="150" y="28" width="12" height="12" rx="2" fill="var(--accent,#c15b39)" fill-opacity="0.55"/>
    <text x="167" y="38" class="lgd">GPU compute</text>
    <rect x="300" y="28" width="12" height="12" rx="2" fill="var(--accent2,#3b82f6)" fill-opacity="0.55"/>
    <text x="317" y="38" class="lgd">Non-GPU (teacher API, storage)</text>
    <rect x="560" y="28" width="12" height="12" rx="2" fill="var(--warn,#e0a106)" fill-opacity="0.55"/>
    <text x="577" y="38" class="lgd">Re-run reality tax</text>
  </g>

  <!-- tier 2 (far) labels -->
  <g>
    <text x="353" y="60" text-anchor="middle" class="name">Mid-training</text>
    <text x="353" y="72" text-anchor="middle" class="amt dim">$8.10</text>
    <line class="lead" x1="353" y1="76" x2="353" y2="112"/>

    <text x="479.25" y="60" text-anchor="middle" class="name">Agent distill</text>
    <text x="479.25" y="72" text-anchor="middle" class="amt dim">$9.80</text>
    <line class="lead" x1="479.25" y1="76" x2="479.25" y2="112"/>

    <text x="580.15" y="60" text-anchor="middle" class="name">SFT+DPO+eval+tok</text>
    <text x="580.15" y="72" text-anchor="middle" class="amt dim">$6.66</text>
    <line class="lead" x1="580.15" y1="76" x2="580.15" y2="112"/>

    <text x="705.9" y="60" text-anchor="middle" class="name">Re-run tax</text>
    <text x="705.9" y="72" text-anchor="middle" class="amt dim">$17.40</text>
    <line class="lead" x1="705.9" y1="76" x2="705.9" y2="112"/>
  </g>

  <!-- tier 1 (close) labels -->
  <g>
    <text x="176.5" y="90" text-anchor="middle" class="name">Pretrain</text>
    <text x="176.5" y="102" text-anchor="middle" class="amt dim">$39.60</text>
    <line class="lead" x1="176.5" y1="106" x2="176.5" y2="112"/>

    <text x="413" y="90" text-anchor="middle" class="name">Scaling ladder</text>
    <text x="413" y="102" text-anchor="middle" class="amt dim">$8.10</text>
    <line class="lead" x1="413" y1="106" x2="413" y2="112"/>

    <text x="535.5" y="90" text-anchor="middle" class="name">GRPO</text>
    <text x="535.5" y="102" text-anchor="middle" class="amt dim">$5.40</text>
    <line class="lead" x1="535.5" y1="106" x2="535.5" y2="112"/>

    <text x="623.3" y="90" text-anchor="middle" class="name">Storage+egress</text>
    <text x="623.3" y="102" text-anchor="middle" class="amt dim">$5.00</text>
    <line class="lead" x1="623.3" y1="106" x2="623.3" y2="112"/>
  </g>

  <!-- end ticks -->
  <line x1="30" y1="112" x2="30" y2="196" class="v-grid" stroke-width="1"/>
  <text x="30" y="206" text-anchor="middle" class="tick dim">$0</text>
  <line x1="770" y1="112" x2="770" y2="196" class="v-grid" stroke-width="1"/>
  <text x="770" y="206" text-anchor="middle" class="tick">~$100</text>

  <!-- the bar -->
  <g stroke="var(--v-stroke)" stroke-width="0.8">
    <!-- Pretrain: Chinchilla floor + over-training -->
    <rect x="30" y="112" width="29.6" height="78" fill="var(--accent,#c15b39)" fill-opacity="0.42"/>
    <rect x="59.6" y="112" width="263.4" height="78" fill="var(--accent,#c15b39)" fill-opacity="0.22"/>
    <line x1="59.6" y1="112" x2="59.6" y2="190" stroke="var(--accent-2,var(--accent,#c15b39))" stroke-width="1.6" stroke-dasharray="4 3"/>

    <!-- Mid-training -->
    <rect x="323" y="112" width="60" height="78" fill="var(--accent,#c15b39)" fill-opacity="0.30"/>
    <!-- Scaling ladder -->
    <rect x="383" y="112" width="60" height="78" fill="var(--accent,#c15b39)" fill-opacity="0.38"/>
    <!-- Agent distill: GPU sub + API sub -->
    <rect x="443" y="112" width="13.3" height="78" fill="var(--accent,#c15b39)" fill-opacity="0.42"/>
    <rect x="456.3" y="112" width="59.2" height="78" fill="var(--accent2,#3b82f6)" fill-opacity="0.34"/>
    <!-- GRPO -->
    <rect x="515.5" y="112" width="40" height="78" fill="var(--accent,#c15b39)" fill-opacity="0.30"/>
    <!-- Small group -->
    <rect x="555.5" y="112" width="49.3" height="78" fill="var(--accent,#c15b39)" fill-opacity="0.22"/>
    <!-- Storage + egress -->
    <rect x="604.8" y="112" width="37" height="78" fill="var(--accent2,#3b82f6)" fill-opacity="0.34"/>
    <!-- Re-run tax -->
    <rect x="641.8" y="112" width="128.2" height="78" fill="var(--warn,#e0a106)" fill-opacity="0.30"/>

    <!-- outer frame -->
    <rect x="30" y="112" width="740" height="78" fill="none" stroke="var(--v-stroke)" stroke-width="1.4"/>
  </g>

  <!-- text inside the over-training sub-segment -->
  <g text-anchor="middle" fill="var(--accent,#c15b39)">
    <text x="191.3" y="140" class="inbar">deliberate over-training ~$36</text>
    <text x="191.3" y="153" class="inbar2">= ~90% of the pretrain line,</text>
    <text x="191.3" y="164" class="inbar2">bought back at serving time</text>
  </g>

  <!-- floor callout -->
  <line class="lead" x1="44.8" y1="190" x2="44.8" y2="216"/>
  <rect x="34" y="216" width="150" height="34" rx="6" class="v-fill" stroke="var(--accent,#c15b39)" stroke-width="1.2"/>
  <text x="109" y="230" text-anchor="middle" class="call-b" fill="var(--accent,#c15b39)">Chinchilla-optimal</text>
  <text x="109" y="242" text-anchor="middle" class="call-b" fill="var(--accent,#c15b39)">floor ~$4</text>

  <!-- agent-distill API callout -->
  <line class="lead" x1="486" y1="190" x2="486" y2="216"/>
  <rect x="382" y="216" width="220" height="52" rx="6" class="v-fill" stroke="var(--accent2,#3b82f6)" stroke-width="1.2"/>
  <text x="492" y="230" text-anchor="middle" class="call-b" fill="var(--accent2,#3b82f6)">$8 of this $9.80 is teacher</text>
  <text x="492" y="243" text-anchor="middle" class="call-b" fill="var(--accent2,#3b82f6)">API, NOT your GPU</text>
  <text x="492" y="257" text-anchor="middle" class="call dim">at 1B this can exceed your own training cost</text>

  <!-- re-run tax callout -->
  <line class="lead" x1="705.9" y1="190" x2="705.9" y2="216"/>
  <rect x="622" y="216" width="150" height="52" rx="6" class="v-fill" stroke="var(--warn,#e0a106)" stroke-width="1.2"/>
  <text x="697" y="230" text-anchor="middle" class="call-b" fill="var(--warn,#e0a106)">~25% for OOMs, bad</text>
  <text x="697" y="243" text-anchor="middle" class="call-b" fill="var(--warn,#e0a106)">launches, 2 restarts</text>
  <text x="697" y="257" text-anchor="middle" class="call dim">the gap between sticker and invoice</text>

  <!-- side note: price band -->
  <g>
    <rect x="30" y="288" width="740" height="66" rx="8" class="v-fill" stroke="var(--v-stroke)" stroke-width="1.2"/>
    <text x="50" y="310" class="side-b">The total is a BAND, not a point: $40 - $100</text>
    <text x="50" y="328" class="side dim">The roughly 2.5x spread between the two ends is entirely $/GPU-hr market price and how</text>
    <text x="50" y="343" class="side dim">many times you fat-finger a launch. Always quote a dollar figure with $/GPU-hr + MFU attached.</text>
  </g>
</svg>
<figcaption><b>Pretraining dominates the bill, and over-training is nearly all of that dominant line.</b> Of the ~$39.60 pretrain segment, only ~$4 is the Chinchilla-optimal floor — the other ~$36 is deliberately spent over-training, a cost bought back many times over in cheaper serving. The two hidden extras are the teacher-API cost inside agent distillation ($8 of $9.80 is not your GPU at all) and the ~25% re-run reality tax that separates the sticker price from the real invoice.</figcaption>
</figure>
