<figure class="viz" id="fig-sft-assistant-mask-stackml">
<button class="viz-replay" type="button">&#x21BB; replay</button>
<svg viewBox="0 0 800 470" role="img" aria-label="A token ribbon of the Stack-100M ChatML single-turn conversation, showing which tokens are masked as context versus supervised in the SFT loss: only the assistant content and its closing end token receive gradient. A strip below shows the causal shift, where the mask applies to the target position and masked targets become ignore index -100.">
<defs>
  <marker id="sm-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M0,1 L9,5 L0,9 Z" fill="var(--v-stroke,#45413a)"/>
  </marker>
</defs>
<style>
  #fig-sft-assistant-mask-stackml text { fill: currentColor; }
  #fig-sft-assistant-mask-stackml .hdr  { font: 700 13px var(--sans,sans-serif); fill: var(--ink); }
  #fig-sft-assistant-mask-stackml .tokm { font: 600 9.5px var(--mono,monospace); }
  #fig-sft-assistant-mask-stackml .tokc { font: 400 9.5px var(--mono,monospace); }
  #fig-sft-assistant-mask-stackml .lab  { font: 400 9px var(--sans,sans-serif); fill: var(--muted,#6d675d); }
  #fig-sft-assistant-mask-stackml .call { font: 600 10px var(--sans,sans-serif); fill: var(--accent,#c15b39); }
  #fig-sft-assistant-mask-stackml .call2 { font: 600 10px var(--sans,sans-serif); fill: var(--muted,#6d675d); }
  #fig-sft-assistant-mask-stackml .cap  { font: 400 10.5px var(--sans,sans-serif); fill: var(--ink-soft,#45413a); }
  #fig-sft-assistant-mask-stackml .capb { font: 700 10.5px var(--sans,sans-serif); fill: var(--ink); }
  #fig-sft-assistant-mask-stackml .leg  { font: 400 9.5px var(--sans,sans-serif); fill: var(--muted,#6d675d); }

  @keyframes sm-fi { from{opacity:0} to{opacity:1} }
  #fig-sft-assistant-mask-stackml [data-anim="1"] { animation: sm-fi .4s ease .1s both; }
  #fig-sft-assistant-mask-stackml [data-anim="2"] { animation: sm-fi .4s ease .8s both; }
  #fig-sft-assistant-mask-stackml [data-anim="3"] { animation: sm-fi .4s ease 1.5s both; }
  #fig-sft-assistant-mask-stackml [data-anim="4"] { animation: sm-fi .4s ease 2.2s both; }
  @media (prefers-reduced-motion: reduce) {
    #fig-sft-assistant-mask-stackml * { animation: none !important; opacity: 1 !important; }
  }
</style>

<text x="20" y="24" class="hdr">Rendered conversation, in order (mask = 0 context / mask = 1 supervised)</text>

<!-- ROW 1 of ribbon: bos, system role, system content, end -->
<g data-anim="1">
  <rect x="20"  y="36" width="46"  height="30" rx="4" fill="var(--surface-3,#ece7da)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="43"  y="55" text-anchor="middle" class="tokc">&lt;bos&gt;</text>

  <rect x="70"  y="36" width="62"  height="30" rx="4" fill="var(--surface-3,#ece7da)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="101" y="55" text-anchor="middle" class="tokc">&lt;system&gt;</text>

  <rect x="136" y="36" width="230" height="30" rx="4" fill="var(--surface-3,#ece7da)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="251" y="50" text-anchor="middle" class="tokc">[You are Stack-100M, a concise,</text>
  <text x="251" y="61" text-anchor="middle" class="tokc">honest assistant.]</text>

  <rect x="370" y="36" width="46"  height="30" rx="4" fill="var(--surface-3,#ece7da)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="393" y="55" text-anchor="middle" class="tokc">&lt;end&gt;</text>
</g>

<!-- ROW 2: user role, user content, end -->
<g data-anim="1">
  <rect x="20"  y="76" width="52"  height="30" rx="4" fill="var(--surface-3,#ece7da)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="46"  y="95" text-anchor="middle" class="tokc">&lt;user&gt;</text>

  <rect x="78" y="76" width="222" height="30" rx="4" fill="var(--surface-3,#ece7da)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="189" y="95" text-anchor="middle" class="tokc">[What is 17 times 4?]</text>

  <rect x="306" y="76" width="46"  height="30" rx="4" fill="var(--surface-3,#ece7da)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="329" y="95" text-anchor="middle" class="tokc">&lt;end&gt;</text>
</g>

<!-- ROW 3: assistant role (masked), assistant content (SUPERVISED), end (SUPERVISED), eos (masked) -->
<g data-anim="2">
  <rect x="20"  y="116" width="78" height="34" rx="4" fill="var(--surface-3,#ece7da)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="59"  y="138" text-anchor="middle" class="tokc">&lt;assistant&gt;</text>

  <rect x="102" y="116" width="228" height="34" rx="4" fill="var(--accent,#c15b39)" fill-opacity=".22" stroke="var(--accent,#c15b39)" stroke-width="1.8"/>
  <text x="216" y="138" text-anchor="middle" class="tokm" fill="var(--accent,#c15b39)">[17 times 4 is 68.]</text>

  <rect x="334" y="116" width="52" height="34" rx="4" fill="var(--accent,#c15b39)" fill-opacity=".22" stroke="var(--accent,#c15b39)" stroke-width="1.8"/>
  <text x="360" y="138" text-anchor="middle" class="tokm" fill="var(--accent,#c15b39)">&lt;end&gt;</text>

  <rect x="390" y="116" width="52" height="34" rx="4" fill="var(--surface-3,#ece7da)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="416" y="138" text-anchor="middle" class="tokc">&lt;eos&gt;</text>
</g>

<!-- callout 1: supervised end -->
<g data-anim="3">
  <line x1="360" y1="150" x2="500" y2="188" stroke="var(--accent,#c15b39)" stroke-width="1.3"/>
  <circle cx="360" cy="150" r="3" fill="var(--accent,#c15b39)"/>
  <text x="440" y="200" class="call">SUPERVISED -- learn to STOP.</text>
  <text x="440" y="213" class="call">Mask this and the model never gets</text>
  <text x="440" y="226" class="call">gradient to end its turn: the</text>
  <text x="440" y="239" class="call">never-shuts-up failure.</text>
</g>

<!-- callout 2: masked assistant role marker -->
<g data-anim="3">
  <line x1="59" y1="150" x2="120" y2="188" stroke="var(--muted,#6d675d)" stroke-width="1.3"/>
  <circle cx="59" cy="150" r="3" fill="var(--muted,#6d675d)"/>
  <text x="20" y="200" class="call2">MASKED -- the harness emits</text>
  <text x="20" y="213" class="call2">it to cue generation; the model</text>
  <text x="20" y="226" class="call2">learns what comes AFTER it,</text>
  <text x="20" y="239" class="call2">not to emit it mid-turn.</text>
</g>

<!-- CAUSAL SHIFT strip -->
<g data-anim="4">
  <line x1="20" y1="268" x2="780" y2="268" stroke="var(--border-2,#d8d1c0)" stroke-width="1"/>
  <text x="20" y="288" class="hdr">Causal shift: mask lands on the TARGET position</text>

  <!-- input tokens row -->
  <text x="20" y="316" class="lab">input t_i:</text>
  <rect x="100" y="302" width="60" height="24" rx="4" fill="var(--surface-3,#ece7da)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="130" y="318" text-anchor="middle" class="tokc">...&lt;end&gt;</text>
  <rect x="166" y="302" width="76" height="24" rx="4" fill="var(--surface-3,#ece7da)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="204" y="318" text-anchor="middle" class="tokc">&lt;assistant&gt;</text>
  <rect x="248" y="302" width="46" height="24" rx="4" fill="var(--accent,#c15b39)" fill-opacity=".22" stroke="var(--accent,#c15b39)" stroke-width="1.6"/>
  <text x="271" y="318" text-anchor="middle" class="tokm" fill="var(--accent,#c15b39)">17</text>
  <rect x="300" y="302" width="46" height="24" rx="4" fill="var(--accent,#c15b39)" fill-opacity=".22" stroke="var(--accent,#c15b39)" stroke-width="1.6"/>
  <text x="323" y="318" text-anchor="middle" class="tokm" fill="var(--accent,#c15b39)">times</text>

  <!-- arrows down to target row -->
  <line x1="130" y1="326" x2="204" y2="352" stroke="var(--v-stroke,#45413a)" stroke-width="1.1" marker-end="url(#sm-arr)"/>
  <line x1="204" y1="326" x2="271" y2="352" stroke="var(--v-stroke,#45413a)" stroke-width="1.1" marker-end="url(#sm-arr)"/>
  <line x1="271" y1="326" x2="323" y2="352" stroke="var(--v-stroke,#45413a)" stroke-width="1.1" marker-end="url(#sm-arr)"/>
  <line x1="323" y1="326" x2="380" y2="352" stroke="var(--v-stroke,#45413a)" stroke-width="1.1" marker-end="url(#sm-arr)"/>

  <!-- target/label row -->
  <text x="20" y="368" class="lab">target t_i+1</text>
  <text x="20" y="382" class="lab">(label):</text>
  <rect x="166" y="352" width="76" height="24" rx="4" fill="var(--surface-3,#ece7da)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="204" y="368" text-anchor="middle" class="tokc">IGNORE(-100)</text>
  <rect x="248" y="352" width="46" height="24" rx="4" fill="var(--accent,#c15b39)" fill-opacity=".22" stroke="var(--accent,#c15b39)" stroke-width="1.6"/>
  <text x="271" y="368" text-anchor="middle" class="tokm" fill="var(--accent,#c15b39)">17</text>
  <rect x="300" y="352" width="46" height="24" rx="4" fill="var(--accent,#c15b39)" fill-opacity=".22" stroke="var(--accent,#c15b39)" stroke-width="1.6"/>
  <text x="323" y="368" text-anchor="middle" class="tokm" fill="var(--accent,#c15b39)">times</text>
  <rect x="352" y="352" width="56" height="24" rx="4" fill="var(--accent,#c15b39)" fill-opacity=".22" stroke="var(--accent,#c15b39)" stroke-width="1.6"/>
  <text x="380" y="368" text-anchor="middle" class="tokm" fill="var(--accent,#c15b39)">4 is...</text>

  <text x="440" y="362" class="lab">F.cross_entropy(ignore_index=-100)</text>
  <text x="440" y="376" class="lab">skips IGNORE positions entirely.</text>
</g>

<!-- caption / legend -->
<g data-anim="4">
  <text x="20" y="410" class="capb">The mask lands on the TARGET after the shift.</text>
  <text x="20" y="426" class="cap">Masking before the shift, or marking &lt;assistant&gt; as supervised, silently trains on the prompt --</text>
  <text x="20" y="440" class="cap">this boundary is the single most common SFT bug.</text>

  <rect x="20" y="452" width="12" height="12" rx="2" fill="var(--accent,#c15b39)" fill-opacity=".22" stroke="var(--accent,#c15b39)" stroke-width="1.6"/>
  <text x="38" y="462" class="leg">supervised (in loss)</text>
  <rect x="180" y="452" width="12" height="12" rx="2" fill="var(--surface-3,#ece7da)" stroke="var(--border-2,#d8d1c0)"/>
  <text x="198" y="462" class="leg">context (conditioned on only)</text>
</g>

</svg>
<figcaption><b>Assistant-only loss masking on the Stack-100M ChatML template: only the assistant's content and its closing <code>&lt;end&gt;</code> receive gradient.</b> Everything else -- the system prompt, user turn, role markers, and trailing <code>&lt;eos&gt;</code> -- is context the model conditions on but is never trained to produce; the mask is applied to the target position after the causal shift, and masked targets become the <code>-100</code> ignore index that <code>F.cross_entropy</code> skips.</figcaption>
</figure>
