<figure class="viz" id="fig-ladder-sweep-nd-plane">
<button class="viz-replay" type="button">↻ replay</button>
<svg viewBox="0 0 800 400" role="img" aria-label="A log-log scatter of the ladder sweep on the N-D plane: four rung columns of non-embedding parameters, four parallel diagonal lines of constant training compute 6ND=C carrying the IsoFLOP backbone points, six off-diagonal fixed-model points pushed to very low or very high tokens-per-parameter that break the constant-compute degeneracy, and a short extrapolation arrow from the top rung to the target model just 0.28 decades further out.">
<defs>
  <marker id="lsnd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="var(--good,#2f9e6e)"/>
  </marker>
</defs>
<style>
  #fig-ladder-sweep-nd-plane text{ fill:var(--ink-soft,#374151); font-family:var(--sans,sans-serif); }
  #fig-ladder-sweep-nd-plane .ax   { font:600 11.5px var(--sans,sans-serif); }
  #fig-ladder-sweep-nd-plane .tick { font:700 9.5px var(--sans,sans-serif); }
  #fig-ladder-sweep-nd-plane .tickv{ font:500 8px var(--mono,monospace); fill:var(--muted,#9ca3af); }
  #fig-ladder-sweep-nd-plane .yt   { font:500 8.5px var(--mono,monospace); fill:var(--muted,#9ca3af); }
  #fig-ladder-sweep-nd-plane .diag { font:600 8px var(--mono,monospace); fill:var(--accent,#c15b39); }
  #fig-ladder-sweep-nd-plane .leg  { font:500 8.3px var(--sans,sans-serif); }
  #fig-ladder-sweep-nd-plane .box  { font:500 8.4px var(--sans,sans-serif); }
  #fig-ladder-sweep-nd-plane .boxhdr{ font:700 8.6px var(--sans,sans-serif); }
  #fig-ladder-sweep-nd-plane .tag  { font:500 7.6px var(--mono,monospace); fill:var(--muted,#9ca3af); }
  #fig-ladder-sweep-nd-plane .arrl { font:700 8.6px var(--sans,sans-serif); fill:var(--good,#2f9e6e); }
  .lsnd-dot  { fill:var(--accent,#c15b39); stroke:var(--surface,#fff); stroke-width:1.1; }
  .lsnd-ring { fill:var(--surface,#fff); stroke:var(--accent2,#3b82f6); stroke-width:1.9; }
</style>

<!-- legend -->
<g data-anim="1">
  <circle cx="116" cy="18" r="5" class="lsnd-dot"/>
  <text x="127" y="22" class="leg">IsoFLOP backbone point (filled)</text>
  <circle cx="440" cy="18" r="5" class="lsnd-ring"/>
  <text x="451" y="22" class="leg">off-diagonal fixed-model point (hollow)</text>

  <line x1="100" y1="34" x2="124" y2="34" stroke="var(--accent,#c15b39)" stroke-width="2"/>
  <text x="129" y="38" class="leg">line of constant compute: 6ND = C</text>
  <line x1="440" y1="34" x2="464" y2="34" stroke="var(--muted,#9ca3af)" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="469" y="38" class="leg">target rung, N ~ 84.5M</text>
</g>

<!-- axes + grid -->
<g data-anim="1">
  <g stroke="var(--v-grid,#d8d1c0)" stroke-width="1" opacity="0.55">
    <line x1="172.9" y1="48" x2="172.9" y2="320"/>
    <line x1="310.7" y1="48" x2="310.7" y2="320"/>
    <line x1="427.8" y1="48" x2="427.8" y2="320"/>
    <line x1="566.1" y1="48" x2="566.1" y2="320"/>
    <line x1="100" y1="250.3" x2="700" y2="250.3"/>
    <line x1="100" y1="110.8" x2="700" y2="110.8"/>
  </g>
  <line x1="672.6" y1="48" x2="672.6" y2="320" stroke="var(--muted,#9ca3af)" stroke-width="1.6" stroke-dasharray="4 3"/>

  <line x1="100" y1="48" x2="100" y2="320" stroke="var(--ink-soft,#45413a)" stroke-width="1.6"/>
  <line x1="100" y1="320" x2="700" y2="320" stroke="var(--ink-soft,#45413a)" stroke-width="1.6"/>

  <text x="92" y="253.5" text-anchor="end" class="yt">1e8</text>
  <text x="92" y="114" text-anchor="end" class="yt">1e9</text>

  <text x="400" y="367" text-anchor="middle" class="ax">non-embedding parameters N (log)</text>
  <text x="24" y="184" text-anchor="middle" class="ax" transform="rotate(-90 24 184)">training tokens D (log)</text>
</g>

<!-- faint orientation guides: tok/param = 20 and 200 -->
<g data-anim="2" opacity="0.45">
  <line x1="100" y1="292.0" x2="700" y2="68.8" stroke="var(--muted,#9ca3af)" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="104" y="306" class="tag">~20 tok/param</text>
  <line x1="100" y1="152.5" x2="380.9" y2="48.0" stroke="var(--muted,#9ca3af)" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="386" y="58" class="tag">~200 tok/param</text>
</g>

<!-- IsoFLOP diagonals: constant 6ND = C -->
<g data-anim="2">
  <path d="M100 166.6 L512.5 320" fill="none" stroke="var(--accent,#c15b39)" stroke-width="1.6" opacity="0.8"/>
  <path d="M100 111.1 L661.7 320" fill="none" stroke="var(--accent,#c15b39)" stroke-width="1.6" opacity="0.8"/>
  <path d="M100 51.6  L700 274.8" fill="none" stroke="var(--accent,#c15b39)" stroke-width="1.6" opacity="0.8"/>
  <path d="M239.4 48  L700 219.3" fill="none" stroke="var(--accent,#c15b39)" stroke-width="1.6" opacity="0.8"/>

  <rect x="204" y="199" width="52" height="12" rx="3" fill="var(--surface,#fff)" opacity="0.85"/>
  <rect x="317" y="188" width="66" height="12" rx="3" fill="var(--surface,#fff)" opacity="0.85"/>
  <rect x="454" y="177" width="52" height="12" rx="3" fill="var(--surface,#fff)" opacity="0.85"/>
  <rect x="574" y="166" width="52" height="12" rx="3" fill="var(--surface,#fff)" opacity="0.85"/>
  <text x="230" y="207" text-anchor="middle" class="diag">C=6e15</text>
  <text x="350" y="196" text-anchor="middle" class="diag">C=1.5e16</text>
  <text x="480" y="185" text-anchor="middle" class="diag">C=4e16</text>
  <text x="600" y="174" text-anchor="middle" class="diag">C=1e17</text>
</g>

<!-- halo rings around the S1 low/high off-diagonal pair -->
<g data-anim="3" opacity="0.7">
  <circle cx="172.9" cy="100.8" r="9" fill="none" stroke="var(--accent2,#3b82f6)" stroke-width="1.2"/>
  <circle cx="172.9" cy="295.8" r="9" fill="none" stroke="var(--accent2,#3b82f6)" stroke-width="1.2"/>
</g>

<!-- 17 ladder points -->
<g data-anim="3">
  <circle class="lsnd-dot" cx="172.9" cy="193.7" r="5"/>
  <circle class="lsnd-dot" cx="310.7" cy="244.9" r="5"/>
  <circle class="lsnd-dot" cx="172.9" cy="138.2" r="5"/>
  <circle class="lsnd-dot" cx="310.7" cy="189.4" r="5"/>
  <circle class="lsnd-dot" cx="427.8" cy="233.0" r="5"/>
  <circle class="lsnd-dot" cx="172.9" cy="78.8"  r="5"/>
  <circle class="lsnd-dot" cx="310.7" cy="130.0" r="5"/>
  <circle class="lsnd-dot" cx="427.8" cy="173.6" r="5"/>
  <circle class="lsnd-dot" cx="310.7" cy="74.5"  r="5"/>
  <circle class="lsnd-dot" cx="427.8" cy="118.1" r="5"/>
  <circle class="lsnd-dot" cx="566.1" cy="169.5" r="5"/>

  <circle class="lsnd-ring" cx="172.9" cy="295.8" r="5"/>
  <circle class="lsnd-ring" cx="310.7" cy="244.5" r="5"/>
  <circle class="lsnd-ring" cx="427.8" cy="201.0" r="5"/>
  <circle class="lsnd-ring" cx="566.1" cy="118.6" r="5"/>
  <circle class="lsnd-ring" cx="172.9" cy="100.8" r="5"/>
  <circle class="lsnd-ring" cx="310.7" cy="105.0" r="5"/>

  <text x="183" y="98"  class="tag">300 tpp</text>
  <text x="183" y="299" class="tag">12 tpp</text>
</g>

<!-- extrapolation arrow: S4 -> target -->
<g data-anim="4">
  <path d="M580 144 L580 58 L670 58" fill="none" stroke="var(--good,#2f9e6e)" stroke-width="1.8" marker-end="url(#lsnd-arrow)"/>
  <text x="625" y="72" text-anchor="middle" class="arrl">extrapolate 44M -&gt; 84.5M</text>
  <text x="625" y="84" text-anchor="middle" style="font:500 7.8px var(--sans,sans-serif);fill:var(--good,#2f9e6e)">(0.28 decades -- a short, honest reach)</text>
</g>

<!-- x-axis rung labels -->
<g data-anim="1">
  <text x="172.9" y="333" text-anchor="middle" class="tick">S1</text>
  <text x="172.9" y="344" text-anchor="middle" class="tickv">~3.9M</text>
  <text x="310.7" y="333" text-anchor="middle" class="tick">S2</text>
  <text x="310.7" y="344" text-anchor="middle" class="tickv">~9.2M</text>
  <text x="427.8" y="333" text-anchor="middle" class="tick">S3</text>
  <text x="427.8" y="344" text-anchor="middle" class="tickv">~18.8M</text>
  <text x="566.1" y="333" text-anchor="middle" class="tick">S4</text>
  <text x="566.1" y="344" text-anchor="middle" class="tickv">~44M</text>
  <text x="672.6" y="333" text-anchor="middle" class="tick" fill="var(--muted,#9ca3af)">target</text>
  <text x="672.6" y="344" text-anchor="middle" class="tickv">~84.5M</text>
</g>

<!-- annotation 1: degenerate direction -->
<g data-anim="5">
  <path d="M705 96 L650 200.8" fill="none" stroke="var(--accent,#c15b39)" stroke-width="1" stroke-dasharray="3 2" opacity="0.75"/>
  <rect x="702" y="58" width="94" height="72" rx="6" fill="var(--surface,#fff)" stroke="var(--border-2,#d1d5db)" stroke-width="1" opacity="0.92"/>
  <text x="708" y="70"  class="box">IsoFLOP slices lie</text>
  <text x="708" y="80"  class="box">on a constant-6ND</text>
  <text x="708" y="90"  class="box">line -- a degenerate</text>
  <text x="708" y="100" class="box">direction: can't</text>
  <text x="708" y="110" class="box">separate alpha</text>
  <text x="708" y="120" class="box">from beta.</text>
</g>

<!-- annotation 2: off-diagonal breaks degeneracy -->
<g data-anim="5">
  <path d="M702 188 L400 90 L172.9 100.8" fill="none" stroke="var(--accent2,#3b82f6)" stroke-width="1" stroke-dasharray="3 2" opacity="0.7"/>
  <path d="M702 248 L400 310 L172.9 295.8" fill="none" stroke="var(--accent2,#3b82f6)" stroke-width="1" stroke-dasharray="3 2" opacity="0.7"/>
  <rect x="702" y="150" width="94" height="112" rx="6" fill="var(--surface,#fff)" stroke="var(--border-2,#d1d5db)" stroke-width="1" opacity="0.92"/>
  <text x="708" y="163" class="box">Off-diagonal</text>
  <text x="708" y="173" class="box">points (cheap</text>
  <text x="708" y="183" class="box">rungs pushed to</text>
  <text x="708" y="193" class="box">very few / very</text>
  <text x="708" y="203" class="box">many tokens)</text>
  <text x="708" y="216" class="box">break the</text>
  <text x="708" y="226" class="box">degeneracy and</text>
  <text x="708" y="236" class="box">pin the</text>
  <text x="708" y="246" class="box">exponents.</text>
</g>

<style>
@media (prefers-reduced-motion: reduce) {
  #fig-ladder-sweep-nd-plane [data-anim] { opacity: 1 !important; animation: none !important; }
}
</style>
</svg>
<figcaption><b>The scaling ladder laid out on the N&#8211;D plane: a measurement instrument, not just a training schedule.</b> Fixed-<var>N</var> rung columns cross four IsoFLOP diagonals (constant 6<var>ND</var> = <var>C</var>) to give the filled backbone points, but every point on one diagonal is degenerate &#8212; it cannot separate <var>&#945;</var> from <var>&#946;</var>. A handful of off-diagonal points (hollow) push the cheap rungs to very few or very many tokens per parameter, breaking that degeneracy, and the target sits just 0.28 decades past the top rung &#8212; a short, honest extrapolation.</figcaption>
</figure>
