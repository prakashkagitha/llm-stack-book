<figure class="viz" id="fig-capstone-pay-once-save-forever">
<button class="viz-replay" type="button">/replay</button>
<svg viewBox="0 0 800 460" role="img" aria-label="A ledger contrasting training compute, 6 N D_train, paid once at about 1.2 times 10 to the 19th FLOPs and 40 dollars, against inference compute, 2 N D per request, paid every request, accumulating to about 5.2 times 10 to the 19th FLOPs for one billion requests -- roughly four times the entire pretraining budget -- so the 36 dollar over-training investment that keeps the model small saves about one full pretrain budget of compute per billion requests.">
  <style>
    #fig-capstone-pay-once-save-forever .ttl{ font:700 14.5px var(--sans,sans-serif); }
    #fig-capstone-pay-once-save-forever .panel-ttl{ font:700 12.5px var(--sans,sans-serif); }
    #fig-capstone-pay-once-save-forever .lbl{ font:600 11px var(--sans,sans-serif); }
    #fig-capstone-pay-once-save-forever .sub{ font:500 10px var(--sans,sans-serif); }
    #fig-capstone-pay-once-save-forever .mono{ font:600 10px var(--mono,monospace); }
    #fig-capstone-pay-once-save-forever .badge{ font:700 10.5px var(--sans,sans-serif); }
    #fig-capstone-pay-once-save-forever .take{ font:600 11.5px var(--sans,sans-serif); }
    #fig-capstone-pay-once-save-forever .gov{ font:600 10.5px var(--mono,monospace); }
    #fig-capstone-pay-once-save-forever text{ fill: var(--ink-soft); }
    #fig-capstone-pay-once-save-forever .dim{ fill: var(--muted); }
  </style>

  <text x="400" y="22" text-anchor="middle" class="ttl">Pay once, save forever: training compute vs. inference compute</text>

  <line x1="400" y1="34" x2="400" y2="366" class="v-grid" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- LEFT: paid once -->
  <g>
    <text x="200" y="54" text-anchor="middle" class="panel-ttl" fill="var(--accent,#c15b39)">PAID ONCE</text>
    <text x="200" y="70" text-anchor="middle" class="sub dim">Training compute = 6 N D_train</text>

    <rect x="90" y="86" width="220" height="150" rx="8" fill="var(--accent,#c15b39)" fill-opacity="0.16" stroke="var(--accent,#c15b39)" stroke-width="1.4"/>

    <!-- Chinchilla floor sliver at top, over-train majority below -->
    <rect x="98" y="94" width="204" height="18" fill="var(--accent,#c15b39)" fill-opacity="0.34"/>
    <text x="200" y="107" text-anchor="middle" class="sub" fill="var(--accent,#c15b39)">Chinchilla floor: ~$4</text>

    <rect x="98" y="114" width="204" height="114" fill="var(--accent,#c15b39)" fill-opacity="0.55"/>
    <text x="200" y="150" text-anchor="middle" class="badge" fill="var(--ink)">the extra ~$36</text>
    <text x="200" y="166" text-anchor="middle" class="sub" fill="var(--ink)">you chose to spend</text>
    <text x="200" y="184" text-anchor="middle" class="sub" fill="var(--ink)">over-training</text>
    <text x="200" y="208" text-anchor="middle" class="mono" fill="var(--ink)">~1.2e19 FLOPs</text>
    <text x="200" y="221" text-anchor="middle" class="mono" fill="var(--ink)">~$40 total</text>

    <text x="200" y="252" text-anchor="middle" class="sub dim">one fixed, finite block --</text>
    <text x="200" y="266" text-anchor="middle" class="sub dim">spent once, then done</text>
  </g>

  <!-- RIGHT: paid forever -->
  <g>
    <text x="600" y="54" text-anchor="middle" class="panel-ttl" fill="var(--accent2,#3b82f6)">PAID FOREVER</text>
    <text x="600" y="70" text-anchor="middle" class="sub dim">Inference = 2 N D per request, every request</text>

    <!-- fanning/growing stack of small blocks -->
    <g fill="var(--accent2,#3b82f6)" stroke="var(--accent2,#3b82f6)" stroke-width="1">
      <rect x="470" y="220" width="30" height="16" fill-opacity="0.30"/>
      <rect x="505" y="208" width="30" height="28" fill-opacity="0.34"/>
      <rect x="540" y="192" width="30" height="44" fill-opacity="0.38"/>
      <rect x="575" y="172" width="30" height="64" fill-opacity="0.42"/>
      <rect x="610" y="146" width="30" height="90" fill-opacity="0.46"/>
      <rect x="645" y="112" width="30" height="124" fill-opacity="0.50"/>
      <rect x="680" y="94" width="30" height="142" fill-opacity="0.55"/>
    </g>
    <text x="475" y="248" class="sub dim">req 1</text>
    <text x="670" y="248" class="sub dim">request N -&gt;</text>

    <path d="M470 236 L720 236" stroke="var(--v-grid)" stroke-width="1"/>
    <path d="M465 232 L720 88" fill="none" stroke="var(--accent2,#3b82f6)" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.6"/>
    <text x="695" y="80" text-anchor="middle" class="sub" fill="var(--accent2,#3b82f6)">outgrows the</text>
    <text x="695" y="93" text-anchor="middle" class="sub" fill="var(--accent2,#3b82f6)">fixed left block</text>

    <rect x="440" y="252" width="300" height="46" rx="6" class="v-fill" stroke="var(--accent2,#3b82f6)" stroke-width="1.2"/>
    <text x="590" y="267" text-anchor="middle" class="mono" fill="var(--accent2,#3b82f6)">1B requests x 256 tok</text>
    <text x="590" y="281" text-anchor="middle" class="mono" fill="var(--accent2,#3b82f6)">~= 5.2e19 FLOPs served</text>
    <text x="590" y="293" text-anchor="middle" class="sub dim">~4x the entire pretrain budget</text>
  </g>

  <!-- center fulcrum / payoff -->
  <g>
    <path d="M330 350 C 360 330, 440 330, 470 350" fill="none" stroke="var(--good,#2f9e6e)" stroke-width="2.2" marker-end="url(#pf-arrow)"/>
    <rect x="120" y="356" width="560" height="64" rx="8" class="v-fill" stroke="var(--good,#2f9e6e)" stroke-width="1.4"/>
    <text x="400" y="374" text-anchor="middle" class="take" fill="var(--good,#2f9e6e)">Over-training kept the model at 100M instead of needing ~200M (roughly 2x serve FLOPs).</text>
    <text x="400" y="392" text-anchor="middle" class="take" fill="var(--good,#2f9e6e)">The ~$36 saves ~one full pretrain-budget of compute PER BILLION requests.</text>
    <text x="400" y="409" text-anchor="middle" class="sub dim">Heavier expected serving -&gt; over-train harder.</text>
  </g>

  <rect x="60" y="432" width="680" height="20" rx="4" fill="none"/>
  <text x="400" y="446" text-anchor="middle" class="gov">lifetime compute = 6 N D_train (once) + 2 N D_inf (forever, per request)</text>

  <defs>
    <marker id="pf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--good,#2f9e6e)"/>
    </marker>
  </defs>
</svg>
<figcaption><b>Training compute is a fixed, one-time bill; inference compute is a bill you pay on every single request.</b> The ~$36 spent over-training Stack-100M is a finite block paid once, but at scale the alternative -- a larger model needing more FLOPs per request, forever -- dwarfs it: a billion requests already cost ~4x the entire pretraining budget in served FLOPs, so keeping the model small pays the over-training investment back many times over.</figcaption>
</figure>
