<figure class="viz" id="fig-mfu-vs-gpu-util">
<svg viewBox="0 0 780 575" role="img" aria-label="Two vertical bars against a shared 100% ceiling. GPU-Util from nvidia-smi is filled to nearly 100%, labeled as a binary busy/idle sampler that says nothing about whether the running kernel was a peak matmul or a tiny memory-bound op. MFU, achieved FLOPs per second divided by peak FLOPs per second, is filled to only about 45%, illustrative, with the unfilled top portion hatched and labeled idle tensor cores that were paid for but not used. A formula box between the bars reads MFU equals 6 times N times tokens per second divided by peak FLOPs. A bottom strip translates higher MFU into fewer GPU-hours and lower cost, and an illustrative inset shows a pathological case of 85 percent util but only 18 percent MFU.">

<style>
  #fig-mfu-vs-gpu-util text{ fill:var(--ink-soft); }
  #fig-mfu-vs-gpu-util .hdr{ font:700 13px var(--sans,sans-serif); }
  #fig-mfu-vs-gpu-util .sub{ font:600 10.5px var(--sans,sans-serif); fill:var(--v-muted); }
  #fig-mfu-vs-gpu-util .val{ font:700 13px var(--mono,monospace); }
  #fig-mfu-vs-gpu-util .val-note{ font:500 9.5px var(--sans,sans-serif); fill:var(--v-muted); font-style:italic; }
  #fig-mfu-vs-gpu-util .axis{ font:600 10px var(--mono,monospace); fill:var(--v-muted); }
  #fig-mfu-vs-gpu-util .hatch-lbl{ font:600 10px var(--sans,sans-serif); fill:var(--ink-soft); }
  #fig-mfu-vs-gpu-util .note{ font:500 10px var(--sans,sans-serif); fill:var(--v-muted); }
  #fig-mfu-vs-gpu-util .note-b{ font:700 10px var(--sans,sans-serif); fill:var(--ink-soft); }
  #fig-mfu-vs-gpu-util .formula{ font:700 12.5px var(--mono,monospace); fill:var(--ink-soft); }
  #fig-mfu-vs-gpu-util .gloss{ font:600 10.5px var(--sans,sans-serif); fill:var(--v-muted); }
  #fig-mfu-vs-gpu-util .sowhat{ font:700 11px var(--sans,sans-serif); fill:var(--ink-soft); }
  #fig-mfu-vs-gpu-util .sowhat-2{ font:500 10px var(--sans,sans-serif); fill:var(--v-muted); }
  #fig-mfu-vs-gpu-util .mini-title{ font:700 10.5px var(--sans,sans-serif); fill:var(--ink-soft); }
  #fig-mfu-vs-gpu-util .mini-val{ font:700 10px var(--mono,monospace); }
  #fig-mfu-vs-gpu-util .mini-lbl{ font:600 9px var(--sans,sans-serif); fill:var(--v-muted); }
  #fig-mfu-vs-gpu-util .mini-note{ font:500 9.5px var(--sans,sans-serif); fill:var(--v-muted); }
</style>

<defs>
  <pattern id="mfu-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="8" stroke="var(--v-muted)" stroke-width="1.5" opacity="0.55"/>
  </pattern>
</defs>

<!-- ceiling and baseline -->
<g data-anim="1">
  <line x1="60" y1="55" x2="700" y2="55" class="v-grid" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="55" y="59" text-anchor="end" class="axis">100%</text>
  <line x1="60" y1="340" x2="700" y2="340" class="v-stroke" stroke-width="1.4"/>
  <text x="55" y="344" text-anchor="end" class="axis">0%</text>
</g>

<!-- ============ LEFT: GPU-Util ============ -->
<g data-anim="2">
  <text x="155" y="32" text-anchor="middle" class="hdr">GPU-Util</text>
  <text x="155" y="46" text-anchor="middle" class="sub">(nvidia-smi)</text>

  <rect x="90" y="66" width="130" height="274" rx="4" fill="var(--accent)" fill-opacity="0.85"
        stroke="var(--v-stroke)" stroke-width="1.2"/>

  <line x1="220" y1="66" x2="234" y2="66" class="v-stroke" stroke-width="1.3"/>
  <text x="240" y="70" class="val">~100%</text>
  <text x="240" y="84" class="val-note">a kernel was running</text>
  <text x="240" y="96" class="val-note">during the sample window</text>

  <text x="65" y="358" class="note-b">Binary busy/idle sampler -</text>
  <text x="65" y="374" class="note">100% just means a kernel</text>
  <text x="65" y="388" class="note">was running, not that it was</text>
  <text x="65" y="402" class="note">a peak-throughput matmul.</text>
</g>

<!-- ============ CENTER: formula ============ -->
<g data-anim="3">
  <rect x="245" y="145" width="300" height="112" rx="8" fill="var(--surface-3)" stroke="var(--border-2)" stroke-width="1"/>
  <text x="395" y="182" text-anchor="middle" class="formula">MFU = 6 * N * (tokens/s)</text>
  <text x="395" y="198" text-anchor="middle" class="formula">/ peak_FLOPs</text>
  <line x1="270" y1="210" x2="520" y2="210" class="v-grid" stroke-width="1"/>
  <text x="395" y="226" text-anchor="middle" class="gloss">6 FLOPs / parameter / token</text>
  <text x="395" y="241" text-anchor="middle" class="gloss">(forward + backward - the 6ND rule)</text>
</g>

<!-- ============ RIGHT: MFU ============ -->
<g data-anim="2">
  <text x="595" y="32" text-anchor="middle" class="hdr">MFU</text>
  <text x="595" y="46" text-anchor="middle" class="sub">(achieved / peak FLOPs)</text>

  <rect x="530" y="55" width="130" height="157" fill="url(#mfu-hatch)" stroke="var(--v-muted)" stroke-width="1"/>
  <rect x="530" y="212" width="130" height="128" rx="0" fill="var(--accent)" fill-opacity="0.85"
        stroke="var(--v-stroke)" stroke-width="1.2"/>
  <rect x="530" y="55" width="130" height="285" rx="4" fill="none" stroke="var(--v-stroke)" stroke-width="1.2"/>

  <text x="595" y="118" text-anchor="middle" class="hatch-lbl">idle tensor cores =</text>
  <text x="595" y="132" text-anchor="middle" class="hatch-lbl">GPU-hours you paid</text>
  <text x="595" y="146" text-anchor="middle" class="hatch-lbl">for but didn't use</text>

  <line x1="660" y1="212" x2="674" y2="212" class="v-stroke" stroke-width="1.3"/>
  <text x="680" y="216" class="val">~45%</text>
  <text x="680" y="230" class="val-note">illustrative, a</text>
  <text x="680" y="242" class="val-note">well-tuned loop</text>
</g>

<!-- ============ so-what strip ============ -->
<g data-anim="4">
  <rect x="40" y="422" width="700" height="42" rx="7" fill="var(--surface-3)" stroke="var(--border-2)" stroke-width="1"/>
  <text x="390" y="440" text-anchor="middle" class="sowhat">Higher MFU -&gt; same model trained in fewer GPU-hours -&gt; lower cost.</text>
  <text x="390" y="455" text-anchor="middle" class="sowhat-2">Chapter's worked example: ~44.5% MFU -&gt; ~24 GPU-hrs -&gt; ~USD 37 (plan's ~USD 40-100 budget)</text>
</g>

<!-- ============ pathological-case inset ============ -->
<g data-anim="5">
  <rect x="40" y="478" width="700" height="87" rx="7" fill="none" stroke="var(--v-muted)" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="55" y="496" class="mini-title">Illustrative: util and MFU can diverge wildly</text>

  <line x1="90" y1="555" x2="230" y2="555" class="v-grid" stroke-width="1"/>

  <rect x="110" y="515" width="34" height="40" fill="var(--accent)" fill-opacity="0.6" stroke="var(--v-stroke)" stroke-width="1"/>
  <text x="127" y="510" text-anchor="middle" class="mini-val">85%</text>
  <text x="127" y="561" text-anchor="middle" class="mini-lbl">util</text>

  <rect x="170" y="546.5" width="34" height="8.5" fill="var(--accent)" fill-opacity="0.6" stroke="var(--v-stroke)" stroke-width="1"/>
  <rect x="170" y="515" width="34" height="31.5" fill="url(#mfu-hatch)" stroke="var(--v-muted)" stroke-width="1"/>
  <text x="187" y="510" text-anchor="middle" class="mini-val">18%</text>
  <text x="187" y="561" text-anchor="middle" class="mini-lbl">MFU</text>

  <text x="240" y="512" class="mini-note">85% GPU-Util but only 18% MFU -</text>
  <text x="240" y="526" class="mini-note">unfused / small-op-bound kernels.</text>
  <text x="240" y="540" class="mini-note">Illustrative only, not a benchmark.</text>
</g>

</svg>
<figcaption><b>GPU-Util tells you the GPU was busy; MFU tells you how much of its peak matmul throughput you actually captured.</b>
<code>nvidia-smi</code>'s util is a binary busy/idle sampler that reads high the instant any kernel runs, while
MFU = achieved FLOPs/s / peak FLOPs/s (via the 6ND rule) exposes the unfilled top of the bar — idle tensor-core
capacity you are still paying for by the GPU-hour.</figcaption>
</figure>
