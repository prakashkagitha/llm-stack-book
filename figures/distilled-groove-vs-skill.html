<figure class="viz" id="fig-distilled-groove-vs-skill">
<button class="viz-replay" type="button">↻ replay</button>
<svg viewBox="0 0 780 650" role="img" aria-label="A terrain cross-section with one narrow carved groove in the middle, paved with a repeated faint search-then-calc-then-answer pattern. An in-distribution question enters at the top and rolls smoothly down the groove through three waypoints -- well-formed tool call, reads observation, correct answer -- reaching a grounded answer at the floor. Three out-of-distribution questions, labeled three retrieval hops, comparison not lookup, and unseen unit conversion, enter to the sides, miss the groove, and land in derail basins tagged with the small-model failure modes: hallucinates the observation, ignores the returned result, infinite re-search loop, and malformed tool call.">
<defs>
  <marker id="dgs-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
  </marker>
  <marker id="dgs-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/>
  </marker>
</defs>
<style>
  #fig-distilled-groove-vs-skill text{ fill:var(--ink-soft); font:400 11px var(--sans,sans-serif); }
  #fig-distilled-groove-vs-skill .h1{ font:700 15px var(--sans,sans-serif); }
  #fig-distilled-groove-vs-skill .sub{ font:400 11px var(--sans,sans-serif); fill:var(--muted); }
  #fig-distilled-groove-vs-skill .q-lbl{ font:700 10.5px var(--sans,sans-serif); }
  #fig-distilled-groove-vs-skill .ood-lbl{ font:600 10px var(--sans,sans-serif); fill:var(--muted); }
  #fig-distilled-groove-vs-skill .wp{ font:600 10.5px var(--sans,sans-serif); }
  #fig-distilled-groove-vs-skill .zone{ font:700 10.5px var(--sans,sans-serif); letter-spacing:.03em; fill:var(--muted); }
  #fig-distilled-groove-vs-skill .chip{ font:600 9px var(--sans,sans-serif); fill:var(--ink-soft); }
  #fig-distilled-groove-vs-skill .ghost{ font:400 italic 9px var(--mono,monospace); fill:var(--muted); }
  #fig-distilled-groove-vs-skill .leg{ font:500 10px var(--sans,sans-serif); fill:var(--muted); }
</style>

<!-- TITLE -->
<text x="16" y="24" class="h1">Distillation carves one groove, not a skill</text>
<text x="16" y="41" class="sub">in-distribution: the marble rolls smoothly to a grounded answer. one step outside: it derails.</text>

<!-- legend -->
<line x1="560" y1="14" x2="580" y2="14" stroke="var(--accent)" stroke-width="2.4"/>
<text x="586" y="18" class="leg">in-distribution path</text>
<line x1="560" y1="31" x2="580" y2="31" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4,3"/>
<text x="586" y="35" class="leg">out-of-distribution -&gt; derail</text>

<!-- ============ TERRAIN ============ -->
<g data-anim="1">
<path d="M16,180 L90,180 C120,180 140,340 170,340 L250,340 C265,340 275,110 290,110 C330,110 360,320 390,540 C420,320 450,110 490,110 C505,110 515,340 530,340 L610,340 C640,340 660,180 690,180 L760,180 L760,620 L16,620 Z"
      class="v-fill" stroke="none"/>
<path d="M16,180 L90,180 C120,180 140,340 170,340 L250,340 C265,340 275,110 290,110 C330,110 360,320 390,540 C420,320 450,110 490,110 C505,110 515,340 530,340 L610,340 C640,340 660,180 690,180 L760,180"
      fill="none" class="v-stroke" stroke-width="2.2"/>
</g>

<!-- derail pits (below basin floor) -->
<g data-anim="2">
<rect x="60" y="340" width="220" height="102" rx="10" fill="var(--muted)" fill-opacity="0.10" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4,3"/>
<rect x="510" y="340" width="220" height="102" rx="10" fill="var(--muted)" fill-opacity="0.10" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="170" y="364" text-anchor="middle" class="zone">DERAIL BASIN</text>
<text x="620" y="364" text-anchor="middle" class="zone">DERAIL BASIN</text>

<rect x="80" y="374" width="180" height="20" rx="5" fill="var(--surface)" stroke="var(--muted)" stroke-width="1"/>
<text x="170" y="388" text-anchor="middle" class="chip">hallucinates the observation</text>
<rect x="80" y="400" width="180" height="20" rx="5" fill="var(--surface)" stroke="var(--muted)" stroke-width="1"/>

<rect x="530" y="374" width="180" height="20" rx="5" fill="var(--surface)" stroke="var(--muted)" stroke-width="1"/>
<text x="620" y="388" text-anchor="middle" class="chip">infinite re-search loop</text>
<rect x="530" y="400" width="180" height="20" rx="5" fill="var(--surface)" stroke="var(--muted)" stroke-width="1"/>
<text x="620" y="414" text-anchor="middle" class="chip">malformed tool call</text>
</g>

<!-- ghosted repeated trajectory-shape paving inside the groove -->
<g class="ghost" data-anim="1">
  <text x="352" y="238" opacity="0.22">search -&gt; calc -&gt; Answer</text>
  <text x="372" y="272" opacity="0.16">search -&gt; calc -&gt; Answer</text>
  <text x="348" y="392" opacity="0.18">search -&gt; calc -&gt; Answer</text>
  <text x="368" y="426" opacity="0.12">search -&gt; calc -&gt; Answer</text>
</g>

<!-- ============ IN-DISTRIBUTION PATH ============ -->
<g data-anim="3">
<circle cx="390" cy="86" r="8" class="v-accent"/>
<text x="390" y="66" text-anchor="middle" class="q-lbl" fill="var(--accent)">QUESTION (in-distribution)</text>

<line x1="390" y1="96" x2="390" y2="528" stroke="var(--accent)" stroke-width="2.6" marker-end="url(#dgs-arrow)"/>

<circle cx="390" cy="200" r="5" fill="var(--accent)"/>
<text x="406" y="204" class="wp">well-formed &lt;|tool_call|&gt;</text>
<circle cx="390" cy="330" r="5" fill="var(--accent)"/>
<text x="406" y="334" class="wp">reads observation</text>
<circle cx="390" cy="470" r="5" fill="var(--good,#2f9e6e)"/>
<path d="M 402,470 L 407,476 L 417,462" fill="none" stroke="var(--good,#2f9e6e)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="424" y="474" class="wp" fill="var(--good,#2f9e6e)">Answer, grounded</text>
</g>

<g data-anim="4">

<text x="95" y="68" text-anchor="middle" class="ood-lbl">3 retrieval hops</text>

<path d="M248,94 C240,180 228,255 218,326" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#dgs-arrow-muted)"/>

<circle cx="630" cy="86" r="7" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.6"/>
<text x="630" y="68" text-anchor="middle" class="ood-lbl">unseen unit conversion</text>
<path d="M630,94 C625,180 622,255 620,326" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#dgs-arrow-muted)"/>

<g stroke="var(--muted)" stroke-width="2" stroke-linecap="round">
  <line x1="113" y1="330" x2="123" y2="340"/><line x1="123" y1="330" x2="113" y2="340"/>
  <line x1="213" y1="330" x2="223" y2="340"/><line x1="223" y1="330" x2="213" y2="340"/>
  <line x1="615" y1="330" x2="625" y2="340"/><line x1="625" y1="330" x2="615" y2="340"/>
</g>
</g>

<!-- bottom caption band -->
<rect x="16" y="605" width="748" height="34" rx="6" fill="var(--surface-3)" stroke="var(--border-2)" stroke-width="1"/>
<text x="390" y="627" text-anchor="middle" class="sub" font-weight="600">a groove, not a skill: genuinely useful inside it, brittle one millimeter outside</text>

</svg>
<figcaption><b>Distillation carves ONE narrow groove -- the demonstrated trajectory shape, worn smooth by repetition.</b> A question whose shape matches the distilled traces rolls cleanly through well-formed tool calls to a grounded answer; a question one step outside that shape -- an extra retrieval hop, a comparison instead of a lookup, an unfamiliar unit conversion -- misses the groove entirely and lands in the same small set of concrete failure modes, because the model learned a groove, not a general skill.</figcaption>
</figure>
