  <line x1="399.3" y1="40" x2="399.3" y2="300" stroke="var(--accent2,#3b82f6)" stroke-width="1.6" stroke-dasharray="6 3"/>
  <line x1="659.3" y1="40" x2="659.3" y2="300" stroke="var(--accent2,#3b82f6)" stroke-width="1.6" stroke-dasharray="6 3"/>

  <text x="399.3" y="313" text-anchor="middle" class="tgt">20 tok/param</text>
  <text x="399.3" y="323" text-anchor="middle" class="tgtv">D ~ 1.7B</text>
  <text x="659.3" y="313" text-anchor="middle" class="tgt">200 tok/param</text>
  <text x="659.3" y="323" text-anchor="middle" class="tgtv">D ~ 16.9B</text>

  <!-- +/-0.1 nat brackets where the curves land -->
  <path d="M406 174.2 L412 174.2 M406 191.0 L412 191.0 M409 174.2 L409 191.0" fill="none" stroke="var(--accent2,#3b82f6)" stroke-width="1.3"/>

<!-- the well-pinned difference between the two targets -->
<g data-anim="5">
  <path d="M399.3 148 L399.3 142 L659.3 142 L659.3 148" fill="none" stroke="var(--good,#2f9e6e)" stroke-width="1.4"/>
  <text x="529" y="124" text-anchor="middle" class="pin">this DIFFERENCE (~0.20 nat) is well-pinned</text>
  <text x="529" y="136" text-anchor="middle" class="pin" style="font-weight:500;">(depends on the exponents, not the loose floor)</text>
</g>

<!-- footer -->
<g data-anim="5">
  <text x="380" y="368" text-anchor="middle" class="foot">a broken run misses by 0.3+ nats -- caught on hour two</text>
</g>

<style>
@media (prefers-reduced-motion: reduce) {
  #fig-loss-extrapolates-constants-dont [data-anim] { opacity: 1 !important; animation: none !important; }

</style>
</svg>
<figcaption><b>Many different (E, A, B) triples fit the same 17 ladder points almost equally well.</b> Their irreducible floors disagree by several tenths of a nat and the curves fan out sharply where data is sparse, yet all four land inside a narrow &#177;0.1-nat band at both the compute-optimal (20 tok/param) and over-trained (200 tok/param) target &#8212; the loss extrapolates even though the individual constants do not, and the ~0.20-nat gain between them is well-pinned because it depends on the well-identified exponents, not the loose absolute offset.</figcaption>
</figure>
