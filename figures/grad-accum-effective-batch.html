<figure class="viz" id="fig-grad-accum-effective-batch">
<button class="viz-replay" type="button">↻ replay</button>
<svg viewBox="0 0 780 575" role="img" aria-label="Process diagram of one optimizer step under gradient accumulation: zero_grad fires once, then N micro-batches each run forward in bf16 autocast, scale their loss by 1/N, and backward-add their gradient into one shared gradient buffer; after the last micro-batch a single clip, optimizer step, and reset discharge the buffer. A callout states the accumulated gradient equals the mean gradient one giant batch would produce, and a separated pitfall box warns that zeroing gradients inside the loop silently shrinks the effective batch.">

<figcaption><b>One optimizer step under gradient accumulation: zero once, accumulate N times, step once.</b>
Each micro-batch runs forward in bf16 autocast, scales its loss by 1/N, and backward-adds its gradient into the
same shared buffer without re-zeroing; only after the Nth micro-batch do clip, <code>optimizer.step()</code>,
and the next <code>zero_grad()</code> fire — making N accumulated micro-batches mathematically equal to one
giant 524,288-token batch, unless the zero_grad call accidentally moves inside the loop.</figcaption>
</figure>
