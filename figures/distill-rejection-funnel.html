<figure class="viz" id="fig-distill-rejection-funnel">
<button class="viz-replay" type="button">↻ replay</button>
<svg viewBox="0 0 820 980" role="img" aria-label="A six-stage top-to-bottom pipeline: a task pool of narrow questions with gold answers, a teacher that rolls out eight diverse trajectories per task at temperature above zero, a filter that keeps only the trajectories whose answer exactly matches gold and collapses eight strands to three survivors, a format-and-mask stage that reuses the supervised versus masked coloring, an SFT stage where Stack-100M imitates the surviving traces, and an optional dashed RLVR polish stage.">
<defs>
  <marker id="drf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">

  </marker>
  <marker id="drf-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
  </marker>
</defs>
<style>

<!-- TITLE -->
<text x="16" y="24" class="h1">Distillation as rejection sampling: wide in, narrow out</text>
<text x="16" y="41" class="sub">teacher rollouts -&gt; verifiable-reward filter -&gt; format + mask -&gt; SFT groove -&gt; optional RLVR polish</text>

<text x="50" y="74" class="stage-lbl">TASK POOL</text>
<text x="180" y="74" class="note">narrow auto-research questions, each with a gold (verifiable) answer</text>

<rect x="170" y="90" width="200" height="46" rx="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"/>

<text x="270" y="124" text-anchor="middle" class="card-s">gold: 4042</text>

</g>

</g>

<text x="740" y="420" text-anchor="middle" class="tiny" fill="var(--muted)">wrong</text>

<circle cx="30" cy="196" r="12" class="v-accent"/>
<text x="30" y="200" text-anchor="middle" class="badge">2</text>
<text x="50" y="200" class="stage-lbl">TEACHER ROLLOUT</text>
<circle cx="182" cy="196" r="8" fill="var(--surface-3)" stroke="var(--border-2)" stroke-width="1"/>
<text x="182" y="200" text-anchor="middle" class="tiny" fill="var(--muted)">1</text>
<text x="605" y="200" class="note">(in CI: a hermetic stub teacher)</text>
</g>

<!-- ============ STAGE 3: FILTER (funnel) ============ -->
<g data-anim="3">
<path d="M 20,430 L 760,430 L 470,576 L 310,576 Z" class="v-fill" stroke="var(--border-2)" stroke-width="1.3" opacity="0.9"/>

<path d="M 240,430 C 260,488 350,540 385,576" fill="none" stroke="var(--good,#2f9e6e)" stroke-width="2"/>
<path d="M 440,430 C 430,488 400,540 392,576" fill="none" stroke="var(--good,#2f9e6e)" stroke-width="2"/>

<text x="390" y="504" text-anchor="middle" class="sub" font-weight="600">(verifiable reward)</text>

<rect x="330" y="584" width="120" height="22" rx="4" fill="var(--good,#2f9e6e)" fill-opacity="0.15" stroke="var(--good,#2f9e6e)" stroke-width="1.1"/>

<circle cx="30" cy="440" r="12" class="v-accent"/>
<text x="30" y="444" text-anchor="middle" class="badge">3</text>
<text x="50" y="444" class="stage-lbl">FILTER</text>
<circle cx="112" cy="440" r="8" fill="var(--surface-3)" stroke="var(--border-2)" stroke-width="1"/>
<text x="112" y="444" text-anchor="middle" class="tiny" fill="var(--muted)">1</text>
</g>

<line x1="390" y1="606" x2="390" y2="628" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#drf-arrow)"/>

<g data-anim="4">
<circle cx="30" cy="644" r="12" class="v-accent"/>

<text x="50" y="648" class="stage-lbl">FORMAT + MASK</text>
<text x="230" y="648" class="sub">one surviving trace, re-rendered with tool tokens + loss mask</text>

<g transform="translate(60,658)">
  <rect x="0" y="0" width="120" height="30" rx="4" fill="var(--surface-3)" stroke="var(--border-2)" stroke-width="1"/>

  <rect x="128" y="0" width="100" height="30" rx="4" fill="var(--surface-3)" stroke="var(--border-2)" stroke-width="1"/>
  <text x="178" y="19" text-anchor="middle" class="pill-lbl" fill="var(--muted)">user (masked)</text>
  <rect x="236" y="0" width="150" height="30" rx="4" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.4"/>
  <text x="311" y="19" text-anchor="middle" class="pill-lbl" fill="var(--accent)">thought+call (SUPERVISED)</text>
  <rect x="394" y="0" width="150" height="30" rx="4" fill="var(--surface-3)" stroke="var(--border-2)" stroke-width="1"/>
  <text x="469" y="19" text-anchor="middle" class="pill-lbl" fill="var(--muted)">tool_result (masked)</text>
  <rect x="552" y="0" width="128" height="30" rx="4" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.4"/>
  <text x="616" y="19" text-anchor="middle" class="pill-lbl" fill="var(--accent)">answer (SUPERVISED)</text>
</g>
</g>

<line x1="390" y1="688" x2="390" y2="710" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#drf-arrow)"/>

<!-- ============ STAGE 5: SFT STACK-100M ============ -->
<g data-anim="5">
<circle cx="30" cy="726" r="12" class="v-accent"/>
<text x="30" y="730" text-anchor="middle" class="badge">5</text>
<text x="50" y="730" class="stage-lbl">SFT STACK-100M</text>

<rect x="270" y="710" width="240" height="56" rx="8" class="v-accent"/>
<text x="390" y="734" text-anchor="middle" class="blk-t">Stack-100M</text>
<text x="390" y="750" text-anchor="middle" class="blk-s">imitate the groove (Ch. 14.9 loop reused)</text>
</g>

<line x1="390" y1="766" x2="390" y2="790" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#drf-arrow)"/>
<text x="404" y="782" class="tiny" fill="var(--muted)">optional</text>

<!-- ============ STAGE 6: RLVR (GRPO) — dashed, optional ============ -->
<g data-anim="5">
<circle cx="30" cy="806" r="12" class="v-accent"/>
<text x="30" y="810" text-anchor="middle" class="badge">6</text>
<text x="50" y="810" class="stage-lbl">RLVR (GRPO)</text>

<rect x="270" y="790" width="240" height="52" rx="8" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="390" y="812" text-anchor="middle" class="sub" font-weight="700">reward = final-answer match</text>
<text x="390" y="828" text-anchor="middle" class="sub">optional polish, not a capability creator</text>
</g>

<!-- caption band -->
<rect x="16" y="858" width="788" height="40" rx="6" class="v-accent"/>
<text x="410" y="883" text-anchor="middle" class="caption-band">wide in, narrow out: the scarce resource is winning traces, not compute</text>

<!-- footnote -->
<line x1="16" y1="912" x2="804" y2="912" stroke="var(--border-2)" stroke-width="1"/>
<circle cx="30" cy="930" r="9" fill="var(--surface-3)" stroke="var(--border-2)" stroke-width="1"/>
<text x="30" y="934" text-anchor="middle" class="tiny" fill="var(--muted)">1</text>
<text x="46" y="930" class="foot">Stages 2-3 ARE rejection sampling against a verifiable reward -- the SAME reward</text>
<text x="46" y="946" class="foot">RLVR (stage 6) uses online, just applied offline to filter demonstrations instead of estimating advantages.</text>

</svg>
<figcaption><b>Distillation is rejection sampling, drawn as a funnel: many diverse teacher rollouts pour in, a verifiable-reward filter keeps only the exact-match winners, and the survivors are formatted, masked, and SFT-imitated into the Stack-100M groove.</b> Diversity comes from teacher temperature; the funnel neck is the sharpest cut in the whole pipeline; the optional RLVR pass at the end only polishes a groove the SFT stage already reached.</figcaption>
</figure>
