<figure class="viz" id="fig-muon-orthogonalization-spectrum">
<button class="viz-replay" type="button">/replay</button>
<svg viewBox="0 0 780 430" role="img" aria-label="Side-by-side comparison showing the raw momentum buffer's singular values decaying steeply, so its update direction stretches into a thin ellipse along one axis, versus the orthogonalized U V transpose flattening all singular values to one, so the update direction becomes a circle pushing equally in every direction.">
<style>
  #fig-muon-orthogonalization-spectrum text     { fill: var(--ink-soft,#45413a); }
  #fig-muon-orthogonalization-spectrum .ttl     { font: 700 15px var(--sans,sans-serif); fill: currentColor; }
  #fig-muon-orthogonalization-spectrum .hdr     { font: 700 12.5px var(--sans,sans-serif); fill: currentColor; }
  #fig-muon-orthogonalization-spectrum .lbl     { font: 600 10px var(--sans,sans-serif); }
  #fig-muon-orthogonalization-spectrum .small   { font: 500 9.5px var(--sans,sans-serif); fill: var(--muted,#6d675d); }
  #fig-muon-orthogonalization-spectrum .mono    { font: 600 9.5px var(--mono,monospace); fill: var(--muted,#6d675d); }
  #fig-muon-orthogonalization-spectrum .axis    { stroke: var(--border-2,#d8d1c0); stroke-width: 1.2; }
  #fig-muon-orthogonalization-spectrum .guide   { stroke: var(--muted,#6d675d); stroke-width: 1; stroke-dasharray: 4 3; opacity: 0.7; }
  #fig-muon-orthogonalization-spectrum .panel   { fill: var(--surface-3,#ece7da); fill-opacity: 0.3; stroke: var(--border-2,#d8d1c0); stroke-width: 1.2; }
</style>

<text x="20" y="24" class="ttl">What orthogonalization does to the momentum update</text>

<g data-anim="1">
  <!-- LEFT panel -->
  <rect x="16" y="40" width="330" height="356" rx="8" class="panel"/>
  <text x="30" y="62" class="hdr">Raw momentum buffer B</text>

  <!-- bar chart of decaying singular values -->
  <line class="axis" x1="46" y1="180" x2="316" y2="180"/>
  <g class="mono">
    <text x="55" y="196" text-anchor="middle">s1</text>
    <text x="99" y="196" text-anchor="middle">s2</text>
    <text x="143" y="196" text-anchor="middle">s3</text>
    <text x="187" y="196" text-anchor="middle">s4</text>
    <text x="231" y="196" text-anchor="middle">s5</text>
    <text x="275" y="196" text-anchor="middle">s6</text>
  </g>
  <rect x="42" y="72"  width="26" height="108" class="v-accent" fill="var(--accent,#c15b39)"/>
  <rect x="86" y="122" width="26" height="58"  class="v-accent" fill="var(--accent,#c15b39)" fill-opacity="0.75"/>
  <rect x="130" y="148" width="26" height="32" class="v-accent" fill="var(--accent,#c15b39)" fill-opacity="0.55"/>
  <rect x="174" y="163" width="26" height="17" class="v-accent" fill="var(--accent,#c15b39)" fill-opacity="0.4"/>
  <rect x="218" y="171" width="26" height="9"  class="v-accent" fill="var(--accent,#c15b39)" fill-opacity="0.3"/>
  <rect x="262" y="175" width="26" height="5"  class="v-accent" fill="var(--accent,#c15b39)" fill-opacity="0.25"/>
  <text x="30" y="74" class="small" text-anchor="start">steep decay: a few directions dominate</text>

  <!-- geometric inset: ellipse -->
  <rect x="46" y="222" width="270" height="150" rx="6" fill="none" class="axis"/>
  <text x="181" y="240" text-anchor="middle" class="small">unit directions mapped through B</text>
  <ellipse cx="181" cy="305" rx="108" ry="26" fill="none" stroke="var(--accent,#c15b39)" stroke-width="2.4"/>
  <line x1="73" y1="305" x2="289" y2="305" class="guide"/>
  <line x1="181" y1="279" x2="181" y2="331" class="guide"/>
  <text x="181" y="358" text-anchor="middle" class="lbl" fill="var(--accent,#c15b39)">learns fast along the long axis,</text>
  <text x="181" y="372" text-anchor="middle" class="lbl" fill="var(--accent,#c15b39)">starves the rest</text>

  <!-- RIGHT panel -->
  <rect x="434" y="40" width="330" height="356" rx="8" class="panel"/>
  <text x="448" y="62" class="hdr">Orthogonalized U V^T</text>

  <line class="axis" x1="464" y1="180" x2="734" y2="180"/>
  <line class="guide" x1="464" y1="80" x2="734" y2="80"/>
  <text x="742" y="84" class="small" text-anchor="start">= 1</text>
  <g class="mono">
    <text x="473" y="196" text-anchor="middle">s1</text>
    <text x="517" y="196" text-anchor="middle">s2</text>
    <text x="561" y="196" text-anchor="middle">s3</text>
    <text x="605" y="196" text-anchor="middle">s4</text>
    <text x="649" y="196" text-anchor="middle">s5</text>
    <text x="693" y="196" text-anchor="middle">s6</text>
  </g>
  <rect x="460" y="80" width="26" height="100" class="v-accent" fill="var(--accent,#c15b39)"/>
  <rect x="504" y="80" width="26" height="100" class="v-accent" fill="var(--accent,#c15b39)"/>
  <rect x="548" y="80" width="26" height="100" class="v-accent" fill="var(--accent,#c15b39)"/>
  <rect x="592" y="80" width="26" height="100" class="v-accent" fill="var(--accent,#c15b39)"/>
  <rect x="636" y="80" width="26" height="100" class="v-accent" fill="var(--accent,#c15b39)"/>
  <rect x="680" y="80" width="26" height="100" class="v-accent" fill="var(--accent,#c15b39)"/>
  <text x="448" y="74" class="small" text-anchor="start">flat spectrum: every direction equal</text>

  <!-- geometric inset: circle -->
  <rect x="464" y="222" width="270" height="150" rx="6" fill="none" class="axis"/>
  <text x="599" y="240" text-anchor="middle" class="small">unit directions mapped through U V^T</text>
  <circle cx="599" cy="305" r="52" fill="none" stroke="var(--accent,#c15b39)" stroke-width="2.4"/>
  <line x1="547" y1="305" x2="651" y2="305" class="guide"/>
  <line x1="599" y1="253" x2="599" y2="357" class="guide"/>
  <text x="599" y="358" text-anchor="middle" class="lbl" fill="var(--accent,#c15b39)">equal-magnitude push</text>
  <text x="599" y="372" text-anchor="middle" class="lbl" fill="var(--accent,#c15b39)">in every direction</text>

  <!-- center arrow -->
  <line x1="352" y1="180" x2="424" y2="180" stroke="var(--ink-soft,#45413a)" stroke-width="2.2" marker-end="url(#msArrow)"/>
  <text x="388" y="164" text-anchor="middle" class="lbl">Newton-Schulz x5</text>
  <text x="388" y="200" text-anchor="middle" class="small">(matmuls only, bf16)</text>
</g>

<defs>
  <marker id="msArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="var(--ink-soft,#45413a)"/>
  </marker>
</defs>

<rect x="16" y="400" width="748" height="26" fill="none"/>
<text x="390" y="410" text-anchor="middle" class="small">Adam rescales each coordinate independently and never sees the matrix; Muon flattens the whole spectrum --</text>
<text x="390" y="422" text-anchor="middle" class="small">a cheap spectral preconditioner (~ Shampoo without the inverse).</text>

</svg>
<figcaption><b>Orthogonalizing the momentum buffer flattens its singular-value spectrum to all-ones, turning a stretched-ellipse update into a circle.</b> The raw buffer B is dominated by a few large singular directions, so the network learns fast along those and starves the rest; replacing B with its polar factor UV^T (approximated by five Newton-Schulz matmul iterations) sets every singular value to 1, so the update pushes with equal magnitude along every direction of the matrix.</figcaption>
</figure>
