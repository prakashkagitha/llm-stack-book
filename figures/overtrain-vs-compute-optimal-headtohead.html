<figure class="viz" id="fig-overtrain-vs-compute-optimal-headtohead">
<button class="viz-replay" type="button">↻ replay</button>
<svg viewBox="0 0 780 480" role="img" aria-label="Two ways to spend the same 8.6e18 training FLOPs: a compute-optimal 190M-parameter model trained on 7.5B tokens versus the plan's over-trained 84.5M-parameter model trained on 16.9B tokens. The two reach nearly identical training loss, but the over-trained model is less than half the size and about 55 percent cheaper to run at inference, permanently.">
<style>
  #fig-overtrain-vs-compute-optimal-headtohead text{ fill:var(--ink-soft,#374151); font-family:var(--sans,sans-serif); }
  #fig-overtrain-vs-compute-optimal-headtohead .bar-hd { font:700 11px var(--sans,sans-serif); fill:var(--ink-soft,#374151); }
  #fig-overtrain-vs-compute-optimal-headtohead .panel-hd { font:700 12.5px var(--sans,sans-serif); }
  #fig-overtrain-vs-compute-optimal-headtohead .blk-txt { font:700 9.5px var(--mono,monospace); fill:var(--accent,#c15b39); }
  #fig-overtrain-vs-compute-optimal-headtohead .loss-txt { font:700 10.5px var(--sans,sans-serif); fill:var(--accent,#c15b39); }
  #fig-overtrain-vs-compute-optimal-headtohead .sm { font:500 8.6px var(--sans,sans-serif); fill:var(--muted,#9ca3af); }
  #fig-overtrain-vs-compute-optimal-headtohead .smb { font:600 8.6px var(--sans,sans-serif); fill:var(--good,#2f9e6e); }
  #fig-overtrain-vs-compute-optimal-headtohead .inf-txt { font:700 9px var(--mono,monospace); fill:var(--accent2,#3b82f6); }
  #fig-overtrain-vs-compute-optimal-headtohead .inf-note { font:600 9px var(--sans,sans-serif); fill:var(--accent2,#3b82f6); }
  #fig-overtrain-vs-compute-optimal-headtohead .cap { font:600 9.5px var(--mono,monospace); fill:var(--ink-soft,#374151); }
  #fig-overtrain-vs-compute-optimal-headtohead .oneliner { font:italic 9.5px var(--sans,sans-serif); fill:var(--ink-soft,#374151); }
  #fig-overtrain-vs-compute-optimal-headtohead .badge { font:500 8.6px var(--sans,sans-serif); fill:var(--muted,#9ca3af); }
</style>

<!-- top: same training compute -->
<g data-anim="1">
  <rect x="20" y="14" width="740" height="28" rx="7" fill="var(--v-grid,#d8d1c0)" opacity="0.5"/>
  <text x="390" y="32" text-anchor="middle" class="bar-hd">same training compute: 6ND ~ 8.6e18 FLOPs, spent two different ways</text>
</g>

<!-- panel divider -->
<g data-anim="1">
  <line x1="390" y1="50" x2="390" y2="468" stroke="var(--border-2,#d1d5db)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="205" y="60" text-anchor="middle" class="panel-hd" fill="var(--accent,#c15b39)">compute-optimal</text>
  <text x="575" y="60" text-anchor="middle" class="panel-hd" fill="var(--accent,#c15b39)">our choice (over-trained)</text>
</g>

<!-- blocks: N (width) x D (height), equal area = same 6ND -->
<g data-anim="2">
  <rect x="125" y="174" width="160" height="71" rx="4" fill="var(--accent,#c15b39)" fill-opacity="0.16" stroke="var(--accent,#c15b39)" stroke-width="1.6"/>
  <text x="205" y="203" text-anchor="middle" class="blk-txt">N = 190M</text>
  <text x="205" y="214" text-anchor="middle" class="blk-txt">D = 7.5B</text>
  <text x="205" y="225" text-anchor="middle" class="blk-txt">40 tok/param</text>

  <rect x="539.5" y="85" width="71" height="160" rx="4" fill="var(--accent,#c15b39)" fill-opacity="0.16" stroke="var(--accent,#c15b39)" stroke-width="1.6"/>
  <text x="575" y="160" text-anchor="middle" class="blk-txt">N = 84.5M</text>
  <text x="575" y="171" text-anchor="middle" class="blk-txt">D = 16.9B</text>
  <text x="575" y="182" text-anchor="middle" class="blk-txt">200 tok/param</text>

  <text x="205" y="167" text-anchor="middle" class="sm">wide &amp; short: big model, fewer tokens</text>
  <text x="575" y="78" text-anchor="middle" class="sm">narrow &amp; tall: small model, more tokens</text>
</g>

<!-- loss readouts + delta brace -->
<g data-anim="3">
  <rect x="160" y="255" width="90" height="24" rx="5" fill="var(--surface,#fff)" stroke="var(--accent,#c15b39)" stroke-width="1.2"/>
  <text x="205" y="271" text-anchor="middle" class="loss-txt">train loss ~2.94</text>
  <rect x="530" y="255" width="90" height="24" rx="5" fill="var(--surface,#fff)" stroke="var(--accent,#c15b39)" stroke-width="1.2"/>
  <text x="575" y="271" text-anchor="middle" class="loss-txt">train loss ~2.95</text>

  <path d="M205 279 L205 285 L575 285 L575 279" fill="none" stroke="var(--good,#2f9e6e)" stroke-width="1.3"/>
  <text x="390" y="298" text-anchor="middle" class="smb">delta ~ 0.01 nat -- imperceptible in generated text</text>
</g>

<!-- inference cost bars -->
<g data-anim="4">
  <text x="390" y="316" text-anchor="middle" class="sm" style="font-weight:700;">inference cost per token (proportional to 2N)</text>

  <text x="205" y="332" text-anchor="middle" class="inf-txt">2 x 190M</text>
  <rect x="92.5" y="337" width="225" height="18" rx="3" fill="var(--accent2,#3b82f6)" fill-opacity="0.75"/>

  <text x="575" y="332" text-anchor="middle" class="inf-txt">2 x 84.5M</text>
  <rect x="525" y="337" width="100" height="18" rx="3" fill="var(--accent2,#3b82f6)" fill-opacity="0.75"/>

  <path d="M205 357 L205 363 L575 363 L575 357" fill="none" stroke="var(--accent2,#3b82f6)" stroke-width="1.3"/>
  <text x="390" y="377" text-anchor="middle" class="inf-note">every future forward pass ~55% cheaper -- permanently</text>
  <text x="390" y="389" text-anchor="middle" class="sm">(memory, latency, and KV-cache footprint too)</text>
</g>

<!-- lifetime compute caption strip -->
<g data-anim="5">
  <rect x="20" y="400" width="740" height="26" rx="6" fill="var(--v-grid,#d8d1c0)" opacity="0.4"/>
  <text x="390" y="417" text-anchor="middle" class="cap">lifetime compute = 6*N*D_train (train ONCE)  +  2*N*D_infer (serve FOREVER)</text>
</g>
<g data-anim="5">
  <text x="390" y="440" text-anchor="middle" class="oneliner">pay the extra training tokens once; collect the inference savings on every request.</text>
</g>

<!-- robustness badge -->
<g data-anim="5">
  <rect x="70" y="450" width="640" height="24" rx="7" fill="none" stroke="var(--border-2,#d1d5db)" stroke-width="1.1" stroke-dasharray="3 2"/>
  <text x="390" y="466" text-anchor="middle" class="badge">loss LEVELS carry +/-0.1 nat; the ~0.01-nat penalty &amp; 0.45x size ratio do NOT -- set by the exponents + the fixed FLOP budget</text>
</g>

<style>
@media (prefers-reduced-motion: reduce) {
  #fig-overtrain-vs-compute-optimal-headtohead [data-anim] { opacity: 1 !important; animation: none !important; }
}
</style>
</svg>
<figcaption><b>Two ways to spend the same ~8.6&#215;10<sup>18</sup> training FLOPs.</b> A compute-optimal 190M-parameter model on 7.5B tokens and the plan's over-trained 84.5M-parameter model on 16.9B tokens land within ~0.01 nats of each other in training loss &#8212; but the over-trained model is less than half the size, so every future inference pass costs roughly 55% less, permanently. You pay the extra training tokens once and collect the inference savings on every request for the life of the model.</figcaption>
</figure>
